authored_category_regex:
  - "(?:scene|combo|spotlight|story|sequence|page|cover|poster|random|iconic)$"

sequence_exempt_rules:
  - temporal_progression
  - repeated_change
  - sequential_causality

# Exact probabilities are calculated through uniformly selected nested wildcard
# routes, so repeated references and routing pools count more than raw text hits.
route_motifs:
  maps_and_charts:
    severity: warning
    roots: [random]
    max_probability: 0.08
    regex:
      - "\\b(?:maps?|atlas|atlases|cartographic|charts?)\\b"

# Policies whose meaning belongs to one wildcard namespace. General route-design
# principles live in prompt.md; these concrete contracts are machine-checkable.
namespace_policies:
  gkr_comics:
    route_exclusions:
      random:
        - design
        - random_design
        - complex
        - random_complex
    prompt_budgets:
      random: {target_items: 16, max_items: 24, max_words: 60, severity: warning}
      random_design: {target_items: 24, max_items: 36, max_words: 90, severity: warning}
      random_complex: {target_items: 24, max_items: 36, max_words: 90, severity: warning}
    forbidden_content:
      speech_containers:
        severity: error
        message: gkr-comics globally excludes speech balloons, dialogue balloons, and narrative captions.
        regex: "\\b(?:speech|dialogue|word|thought) balloons?\\b|\\bnarrative captions?\\b|\\bcaption boxes?\\b"
    restricted_content:
      superhero_onomatopoeia:
        severity: error
        message: Onomatopoeia is allowed only in the dedicated superhero pool and superhero spotlight leaves.
        regex: "\\b(?:KABOOM|POW|ZZZAP|CRASH|WHAM|SKRAKOOM|THWIP|onomatopoeia)\\b"
        allowed_categories: [superhero_onomatopoeia, spotlight_classicscenes]

patterns:
  forbidden_quality_filler:
    severity: error
    message: Generic quality filler is forbidden by the global prompt rules.
    suggestion: Remove the filler and describe a concrete visible property only when needed.
    regex:
      - "\\b(?:masterpiece|best quality|amazing quality|absurdres|highres|highly detailed|ultra detailed|epic quality)\\b"

  negative_prompt_fragment:
    severity: error
    message: Wildcard leaves must not contain negative-prompt boilerplate.
    suggestion: Remove the negative-prompt fragment; express an explicit scene exclusion only when required.
    regex:
      - "\\b(?:negative prompt|worst quality|low quality|bad anatomy|bad hands|text artifacts?)\\b"

  unresolved_review_marker:
    severity: error
    message: Temporary visual-review marker remains unresolved.
    regex:
      - "\\[VISUAL-REVIEW\\]"

  invisible_intent:
    severity: warning
    authored_only: true
    message: Intent, planning, or desired outcome may not be visible in the image.
    suggestion: Replace intent with a visible gesture, document, tool arrangement, or current physical action.
    regex:
      - "\\b(?:carefully planned|planning to|plans to|trying to|attempting to|hoping to|intends? to|preparing to|decides? to|refuses? to|wants? to|seeks? to)\\b"

  invisible_history_or_status:
    severity: warning
    authored_only: true
    message: History, identity, status, or relationship requires observable evidence.
    suggestion: Add visible documents, wear, matching objects, clothing, signage, damage, or spatial evidence.
    regex:
      - "\\b(?:former |longtime |forgotten culture|across generations|family legacy|secret identity|true identity|wrongfully|unable to|after an argument|after a promotion|before the start|final command)\\b"

  temporal_progression:
    severity: warning
    authored_only: true
    message: Time progression requires observable current evidence or an explicit sequential format.
    suggestion: Freeze the concept at one visible moment. Narrative mode may instead specify panels, a storyboard, diptych, or contact sheet; tags mode may not.
    regex:
      - "\\b(?:eventually|gradually|over time|every few seconds|through a chain|across several seasons|through history|followed by|as they pass|becomes?|transforms?|progressively)\\b"

  repeated_change:
    severity: warning
    authored_only: true
    message: Repetition or changing state may require an explicit sequential format.
    suggestion: Show visible accumulated evidence in one frame. Repeated panels are available only in narrative mode.
    regex:
      - "\\b(?:repeatedly|successive|incremental improvement|keeps? changing|changing positions|each time|whenever)\\b"

  sequential_causality:
    severity: warning
    authored_only: true
    message: Causality or a multi-step outcome is not inherently visible in one frame.
    suggestion: Describe the cause and result as simultaneous visible evidence. Explicit sequential formats are available only in narrative mode.
    regex:
      - "\\b(?:because|therefore|so that|leading to|resulting in|causing|undermines? every|sacrificing .* finish|recovering from)\\b"

  sound_dependency:
    severity: warning
    authored_only: true
    message: The central idea may depend on sound or spoken content.
    suggestion: Replace sound with visible waveform, notation, subtitle, display, gesture, or physical response evidence.
    regex:
      - "\\b(?:telling (?:a )?stor(?:y|ies)|shouting unheard|phones? ringing|dialogue carried|musical phrase|mechanical rhythms|hears?|listens? to|sound of)\\b"

  vague_visual_claim:
    severity: warning
    authored_only: true
    message: Abstract evaluation or unspecified behavior needs concrete visual evidence.
    suggestion: Name the exact pose, action, object, expression, material, or spatial contrast.
    regex:
      - "\\b(?:used intelligently|each contributing differently|different visual rules|technique and hospitality distinguishing|practical detail|carefully coordinated|meaningful interaction|important decision|mundane interruptions|ensemble reactions?)\\b"

  interpretive_visual_modifier:
    severity: warning
    rewrite_must_resolve: true
    message: An interpretive adjective is not independently representable and must not carry the visual concept by itself.
    suggestion: Remove the modifier when redundant. Otherwise retain only concrete evidence already present in the leaf, such as named period materials, specified unusual objects or dress, repeated matching forms, or exact spatial geometry; do not invent evidence merely to preserve the adjective.
    regex:
      - "\\b(?:familiar|eccentric|historical|recurring)\\b"

  underspecified_specificity:
    severity: warning
    rewrite_must_resolve: true
    message: A hyphenated *-specific label defers the visible detail instead of naming what makes the subject, object, or setting distinctive.
    suggestion: Remove the *-specific shorthand and retain only concrete evidence already present, such as named garments, tools, materials, architecture, anatomy, equipment, or props. Do not invent details merely to replace the label.
    regex:
      - "\\b[A-Za-z][A-Za-z-]*-specific\\b"

  unspecified_impossibility:
    severity: warning
    rewrite_must_resolve: true
    message: Impossible is an interpretation, not a visible property, unless the leaf specifies the violated geometry, anatomy, scale, or physical relationship.
    suggestion: Remove impossible when concrete contradictory geometry or scale is already stated; otherwise omit the unsupported claim rather than inventing a new anomaly.
    regex:
      - "\\bimpossible(?:-scale)?\\b"

  ambiguous_looming:
    severity: warning
    rewrite_must_resolve: true
    message: Looming does not specify the scale or spatial cue the image must show.
    suggestion: Use already-supported relative scale and placement such as filling the upper frame, rising above small foreground figures, or a supplied low-angle view; otherwise remove looming.
    regex:
      - "\\blooming\\b"

  temporal_state_transition:
    severity: warning
    rewrite_must_resolve: true
    message: A transition verb may ask one image to communicate change over time instead of one stable visible state.
    suggestion: Freeze the concept at one visible endpoint or intermediate state. Name simultaneous visible evidence, such as multiple separated silhouettes or a body partly composed of petals, without relying on the process verb.
    regex:
      - "\\b(?:becoming|transforming|fragmenting|materializing|dematerializing|morphing|evolving)\\b"
      - "\\b(?:shifting between|changing into|turning into|splitting into|dissolving into|multiplying into)\\b"

  dynamic_event_shorthand:
    severity: warning
    rewrite_must_resolve: true
    message: Crashing names an event but may not specify the single visible impact state.
    suggestion: "Freeze the event at visible contact: identify what strikes what and retain supplied deformation, spray, debris, foam, or body position. For waves, prefer a curling crest striking named rocks or a hull with impact spray and foam."
    regex:
      - "\\bcrashing\\b"

  generic_mood_language:
    severity: warning
    message: Mood or atmosphere wording may not identify its visible cause.
    suggestion: Express mood through supplied light, weather, posture, materials, or spatial arrangement.
    regex:
      - "\\b(?:playful mood|nostalgic mood|magical atmosphere|mysterious atmosphere|welcoming atmosphere|dramatic atmosphere|tense atmosphere)\\b"

  vague_reaction:
    severity: warning
    authored_only: true
    message: A reaction is requested without necessarily specifying its visible form.
    suggestion: Specify an observable gaze, facial expression, hand action, or body orientation.
    regex:
      - "\\b(?:reaction coverage|reaction shot|reaction face|facial reaction|every reaction)\\b"
