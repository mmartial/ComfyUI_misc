# Deterministic constraints used only for files declaring MODE: tags.
# Semantic exceptions remain warnings for human/LLM review.
max_phrase_words: 4
relationship_max_phrase_words: 10
# Longer phrases are allowed when splitting them would destroy a visible
# subject/action, spatial, or source/target relationship.
relationship_regex: "\\b(?:between|beneath|above|below|behind|before|toward|against|from|into|through|across|among|holding|gripping|protecting|fighting|facing|chasing|blocking|catching|carrying|surrounding|arcing|projecting|showing|listing|reaching|passed|passing|braced|covered|filled|filling|cut|left|repeated|standing|kneeling|crouching|climbing|crawling|extending|hovering|floating|dissolving|splitting)\\b"
max_weighted_terms: 3
sentence_connector_regex: "\\b(?:is|are|was|were|while|whereas)\\b"
