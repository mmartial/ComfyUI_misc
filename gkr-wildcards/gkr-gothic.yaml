# ------------------------------------------------------------------------

  standalone_character_combo:
    - "standalone gothic household character, __gkr_gothic/household_character__, keys ledger or cleaning tools in reach, plain domestic room, __gkr_gothic/rendering__"
    - "standalone gothic investigator, __gkr_gothic/investigator_character__, evidence tools visible, __gkr_gothic/rendering__"
    - "standalone religious gothic character, __gkr_gothic/religious_character__, ritual objects, visible material wear, __gkr_gothic/rendering__"
    - "standalone medical gothic character, __gkr_gothic/medical_character__, practical instruments visible, __gkr_gothic/rendering__"
    - "standalone folk gothic character, __gkr_gothic/folk_character__, locally made clothing and objects, __gkr_gothic/rendering__"
    - "standalone supernatural gothic character, __gkr_gothic/supernatural_character__, (one impossible body trait isolated:1.2), plain dark wall, __gkr_gothic/rendering__"

  ensemble_combo:
