    - "Gothic environment design sheet for __gkr_gothic/sacred_environment__, site plan, ritual path, damaged architecture, material decay and human scale"
    - "Gothic environment design sheet for __gkr_gothic/maritime_environment__, tide or storm states, access routes, interior cutaway and weather damage"

  storyboard_combo:
