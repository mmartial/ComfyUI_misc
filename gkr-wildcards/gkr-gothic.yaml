# ========================================================================
# GOTHIC HORROR — VISUAL WILDCARDS FOR COMFYUI
#
# COVERS: Haunted people and places where buried histories return through decaying
# architecture, family secrets, folklore, romance, investigation, and bodily dread.
# Architecture, inheritance, repression, haunting, folklore, mortality,
# romance, investigation, and bodily dread expressed as visible imagery.
#
# Theme core components: visual grammar, character, architecture/environment,
# supernatural pressure, narrative action, and mood; make dread visibly causal.
#
# ROUTE USAGE
# combo: Composes compatible components into a coherent, production-ready prompt.
# spotlight: Selects a curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
#
# DIFFUSION-READY TRANSFORMATION RULE
# Every generated leaf must already describe an image without requiring interpretation:
# subject + visible pose/action + concrete setting/props + composition/light when useful.
# Replace motives, backstory, relationships, themes, causality and time-based change with
# observable evidence. Use gestures, eyelines, documents, screens, damage, clothing, objects
# and spatial contrast. Use explicit panels/storyboards for concepts needing multiple moments.
# A downstream LLM may clarify wording but must not invent the visual representation.
#
# NON-LEAF / COMPOSITE RULE
# Router-only items contain wildcard references only. Literal text added by a composite must
# itself be diffusion-ready. Every possible referenced pairing must remain visually compatible;
# do not combine broad pools when subject, setting, era, equipment, scale or format can conflict.
# ========================================================================

gkr_gothic:

# ------------------------------------------------------------------------
# VISUAL GRAMMAR
# ------------------------------------------------------------------------

  gothic_tradition:
    - eighteenth-century literary Gothic, ruined estates, candlelit chambers, sublime landscape and restrained terror
    - Victorian Gothic, mourning customs, gaslit institutions, industrial soot and elaborate domestic interiors
    - Southern Gothic, decaying prosperity, oppressive heat, family relics and overgrown property
    - Romantic Gothic, storm landscapes, doomed intimacy, pale dawn and emotionally charged architecture
    - ecclesiastical Gothic, monumental stone nave, overturned altar, cracked reliquary, extinguished candles and priest kneeling between bloodied vestments and an open grave
    - folk Gothic, isolated community, seasonal materials, handmade ritual objects and watchful landscape
    - maritime Gothic, salt-damaged buildings, storm signals, drowned objects and black coastal water
    - medical Gothic, anatomy theatre, clinical restraint, specimen cabinets and bodily uncertainty
    - urban gaslamp Gothic, crowded lodging houses, narrow streets, institutions and class separation
    - modern domestic Gothic, ordinary home, inherited objects, architectural repetition and one impossible detail

  camera:
    - distant view through a partially open doorway, observer separated from the subject
    - symmetrical room frame with one architectural inconsistency
    - close view of hands, letter, key or damaged keepsake with threat blurred behind
    - low corridor perspective, repeating doors and converging floor pattern
    - high view exposing a vulnerable figure within monumental architecture
    - static wide composition with the subject placed near an exit that will not open
    - over-the-shoulder view toward a reflection that does not match the room
    - intimate paired portrait with withheld touch and conflicting eyelines
    - exterior long shot reducing travelers beneath hostile weather and landscape
    - restrained portrait lit by one practical source outside the frame

  lighting:
    - weak morning light through dirty lace curtains, natural colors drained by rain
    - single oil lamp with uneven amber falloff and unreadable distant corners
    - overcast daylight filling the room while one doorway remains unnaturally black
    - dying fireplace light reflected in polished wood and mostly unlit faces
    - pale winter dusk, flat exterior light and warm windows without silhouettes
    - lightning revealing an unexpected figure for one instant through tall windows
    - candle extinguished moments ago, smoke crossing a narrow moonbeam
    - cold institutional skylight above warmer handheld lamps
    - hard coastal dawn through salt-streaked glass
    - practical gaslight interrupted by alternating failed fixtures

  rendering:
    - Gothic book illustration, fine crosshatching, restrained sepia wash and generous paper white
    - dark oil painting, visible brushwork, deep earth pigments and controlled candlelight
    - black-and-white wood engraving, carved textures and broad pools of shadow
    - faded hand-tinted photograph, soft focus and damaged emulsion edges
    - theatrical Gothic melodrama painting, velvet color and expressive staging
    - stark charcoal drawing, erased highlights and rough paper grain
    - cinematic Gothic realism, natural material decay, practical lighting and fine film grain
    - ink-wash horror illustration, bleeding edges and one restrained spot color

# ------------------------------------------------------------------------
# GENRE-SAFE CHARACTER FAMILIES
# ------------------------------------------------------------------------

  household_character:
    - grieving estate heir in altered mourning clothes, sealed letter and ring of unfamiliar keys
    - stern housekeeper carrying an inventory ledger, every room key except one
    - aging family solicitor with document case, spectacles and a portrait wrapped in cloth
    - child resident holding a repaired doll whose clothing matches an old family photograph
    - impoverished aristocrat wearing carefully maintained formal clothes in a visibly decaying room
    - distant relative arriving with one small trunk and knowledge of a forbidden room
    - elderly tenant guarding decades of correspondence inside a worn traveling case
    - newly married resident noticing their likeness in an ancestral portrait

  investigator_character:
    - period detective with notebook, shaded lantern and mud-stained evidence envelopes
    - physician carrying a leather diagnostic case and visibly contradictory anatomical sketches
    - skeptical archivist with cotton gloves, magnifying lens and altered parish records
    - occult scholar using chalk, measuring cord and translated ritual fragments
    - coastal constable carrying tide tables beside a water-damaged missing-person notice
    - insurance inspector photographing a fire-damaged manor where no object is burned
    - journalist comparing witness statements beneath a wall of family photographs
    - amateur naturalist documenting tracks that begin as animal prints and end as bare feet

  religious_character:
    - exhausted exorcist in travel-worn clerical clothing, prayer book, candle and practical medical restraints
    - conflicted parish priest holding a damaged reliquary before an empty congregation
    - convent gardener carrying pruning tools past headless saint statues
    - young acolyte kneeling beside a lifted chapel flagstone, fresh black soil and pale roots spilling across the sealed floor, candle held close to the opening
    - rural ritual keeper arranging handmade offerings according to a faded seasonal diagram
    - hospital chaplain seated beside a patient whose reflection remains standing
    - disgraced theologian translating marginal notes from a forbidden devotional text
    - silent pilgrimage guide carrying votive tokens from travelers who never returned

  medical_character:
    - anatomy lecturer in a stained apron, pointer paused over an impossible specimen
    - asylum nurse carrying a key ring and folded patient drawings
    - village healer sorting dried herbs beside a bundle containing human teeth
    - mortuary attendant pulling open an old sealed drawer, fresh condensation and one handprint visible on the inner metal surface
    - surgeon washing instruments while an empty operating table slowly depresses
    - rehabilitation patient stacking wooden blocks with a stitched hand, mismatched fingerprint ink tests and grip diagrams spread beside the exercise board
    - apothecary comparing medicine bottles whose labels have exchanged names
    - undertaker measuring an apparently empty coffin from the inside

  folk_character:
    - harvest-master wearing ordinary work clothes and a handmade straw mask
    - isolated innkeeper serving identical meals to silent local patrons
    - shepherd carrying bells removed from animals that returned without shadows
    - village bride wearing inherited flowers dried almost black
    - woodcarver producing protective figures whose faces resemble recent visitors
    - ferryman collecting tokens from passengers visible only in the water
    - midwife carrying a woven basket toward a house every resident avoids
    - traveling musician whose regional songs cause villagers to close their shutters

  supernatural_character:
    - translucent drowned bride, water-dark dress and weeds caught in streaming hair
    - pale vampire in old formal clothes, subtle fangs and no reflection in nearby silver
    - revenant in burial clothes, grave soil beneath intact fingernails and one personal token
    - spectral child with indistinct face, feet fading above the floor and toy held at the side
    - frost-rimmed soldier apparition, incomplete uniform and broken weapon lowered
    - veiled banshee whose fabric moves while every curtain remains still
    - humanlike shadow with edges dissolving against the direction of the room light
    - stitched creation in heavy work clothes, uncertain expression and careful gentle hands

  relationship:
    - heir reaching for a locked family-room key while the housekeeper blocks the door with both hands and lowered gaze
    - injured investigator leaning on a witness who holds the only lantern inside a flooded underground passage
    - living spouse pressing a palm to a rain-streaked window while a spectral beloved mirrors the gesture from the reflection
    - parent hiding a blood-marked diary behind their back while the child points toward a pale figure at the end of the corridor
    - physician comparing their newly scarred hand with an identical scar spreading across the restrained patient's hand
    - priest holding a scorched reliquary while a skeptic measures the same burn pattern with calipers and notebook
    - siblings pulling the same inherited locket in opposite directions, one displaying its portrait and the other its hidden compartment
    - village host pouring tea without smiling while a rain-soaked visitor notices every other cup placed for an empty chair

# ------------------------------------------------------------------------
# ENVIRONMENTS AND PHYSICAL SUBJECTS
# ------------------------------------------------------------------------

  domestic_environment:
    - inherited country estate, family portraits turned toward the wall and locked west wing
    - sealed nursery, sheet-covered furniture, faded wallpaper and one recently disturbed toy
    - manor dining room set for an absent guest, condensation forming on one untouched glass
    - narrow boarding-house corridor, identical doors and floral wallpaper repeating incorrectly
    - family portrait gallery, generations of stern faces and one fresh canvas in an antique frame
    - flooded townhouse cellar, floating papers and an iron door visible below the water

  institutional_environment:
    - abandoned anatomy theatre, tiered benches, stained table and cabinets of cloudy specimens
    - decaying asylum ward, rusted beds, observation windows and patient drawings behind plaster
    - shuttered opera house, dusty velvet seats and stage curtain moving without a draft
    - snowbound railway platform, stopped clock, abandoned luggage and no tracks beyond the station
    - old courthouse archive, warped shelves, sealed testimony and water spreading from a dry wall
    - charity hospital chapel, empty pews, medical screens and wax footprints ending at the altar

  sacred_environment:
    - crumbling cathedral nave, damaged stained glass, empty pews and translucent faces in the stone
    - overgrown convent garden, headless saints, thorn-choked paths and an empty well
    - rural chapel, handmade votive figures and floorboards repaired in several eras
    - cliffside monastery, storm bells, salt-damaged manuscripts and sealed lower stairs
    - cemetery ossuary, labeled bones, missing nameplates and one recently opened niche
    - pilgrimage road through barren hills, abandoned offerings and footprints that never leave the path

  folk_environment:
    - remote harvest village, woven effigies above every doorway and fields cut into unfamiliar symbols
    - isolated moorland inn, muddy footprints ending at the stairs while guests face the door
    - sacred grove, stone altar, votive ribbons and one chair facing away from the gathering
    - orchard after a wedding feast, identical flower crowns and abandoned shoes lined at the field edge
    - village well surrounded by offerings of hair, toys and carefully folded letters
    - winter procession route marked by lanterns leading into an unoccupied forest

  maritime_environment:
    - coastal fishing village at low tide, empty boats and bells sounding from offshore
    - storm-battered cliff manor, salt-rotted windows and one upper room kept dry
    - abandoned lighthouse interior, wet spiral stairs and keeper logs continuing after evacuation
    - wrecked chapel revealed below the tide, pews covered in weed and candles still upright
    - fogbound ferry landing, timetable for a route removed from every current map
    - sea cave beneath a cemetery, coffin fragments and fresh flowers above the waterline

  gothic_prop:
    - sealed family letter with handwriting changing midway down the page
    - iron key whose teeth match no lock but leave rust marks on one door
    - mourning portrait where the sitter's hands occupy a different pose in reflection
    - cracked music box playing only while the lid remains closed
    - medical diagram with layered corrections forming a second anatomy
    - tide ledger recording arrivals on nights when no boat sailed
    - child's doll repaired with fabric cut from an adult burial garment
    - ritual bundle of herbs, hair, teeth and a photograph taken decades later

  creature_subject:
    - corpse moths clustering into the outline of a missing face
    - gaunt antlered animal standing motionless at the edge of cultivated land
    - grave hound with exposed ribs packed with roots and cemetery flowers
    - immense pale cave organism visible through a ring of closed eyes and breathing folds
    - house centipede assembled from porcelain doll limbs and human hair
    - black coastal bird carrying strips of burial cloth inland
    - many-jointed figure whose silhouette contradicts the direction of every light
    - living topiary shaped like generations of a family walking toward the house

# ------------------------------------------------------------------------
# AUTHORED VISUAL SCENES
# ------------------------------------------------------------------------

  haunting_scene:
    - resident reading beside a dying fireplace while a translucent child sits unnoticed at their feet
    - wooden horse rocking in a sealed nursery, damp footprints ending beneath the bed
    - family dinner arranged for an absent guest, every portrait turned toward the empty chair
    - drowned apparition beyond an upper-floor window, wet handprint appearing on the inside glass
    - old woman folding clothes while an unseen person depresses the chair opposite her
    - corridor lamps extinguishing one by one toward a figure who remains still

  psychological_scene:
    - solitary figure facing a mirror reflection turned in the wrong direction
    - detective comparing two family photographs containing the same unknown child decades apart
    - patient walking a corridor where every clock shows a different hour
    - woman setting tea for an unseen visitor as the second cup gradually empties
    - scholar finding notebooks that describe the room from a viewpoint inside the wall
    - man returning home to a family calmly displaying his funeral portrait

  folk_horror_scene:
    - smiling villagers carrying woven effigies toward a hilltop fire while one outsider is held back
    - masked residents circling an empty chair during a daylight seasonal rite
    - rural wedding guests wearing identical crowns beside shoes lined at the field edge
    - healer holding an opened charm bundle above a table, human teeth dropping from dried plants onto white cloth under lamplight
    - traveler sheltering in an inn while every patron recites the same prayer
    - children replacing village door markings as adults watch from shuttered windows

  gothic_romance_scene:
    - estranged lovers separated by a rain-streaked window, one visible only in reflection
    - widow reading forbidden letters beside an unopened crypt at cold dawn
    - vampire offering a gloved hand in an empty ballroom, attraction and suspicion held in posture
    - spectral bride waiting at a ruined altar as an aged beloved approaches with a lantern
    - heir uncovering a lost lover's portrait bearing their own face
    - doomed couple embracing on a cliff while an ancestral manor burns far behind

  investigation_scene:
    - detective examining muddy barefoot tracks that begin inside a locked study
    - doctor and constable inspecting a warm bed in an otherwise empty sealed room
    - scholar mapping symbols carved beneath village thresholds while residents watch
    - investigators opening a family archive where fresh ink covers undisturbed dust
    - coastal priest and detective following wet footprints inland from a chapel bell heard beneath the sea
    - anatomist comparing a missing-person sketch with a face inside an unlabeled specimen jar

  medical_horror_scene:
    - surgical team watching an empty operating table sink beneath invisible weight
    - patient and physician comparing scans that show different skeletons at the same time
    - anatomy students surrounding a demonstration specimen whose torso bears the same branching scar as one student's exposed forearm, every gaze fixed between the two marks
    - asylum nurse unlocking a room whose interior is much larger than the building
    - undertaker measuring a coffin while tapping answers from inside match each number
    - apothecary arranging bottles that cast shadows shaped like their former patients

  maritime_horror_scene:
    - lighthouse keeper reading a fresh log entry in their own handwriting during a storm
    - villagers watching empty fishing boats return in formation at low tide
    - ferry passengers waiting for a vessel visible only as lights beneath black water
    - cliff-manor residents setting places for relatives lost at sea generations earlier
    - investigator descending into a chapel exposed beneath the retreating tide
    - drowned belongings washing ashore arranged in the order their owners disappeared

  quiet_horror_scene:
    - ordinary breakfast room with one chair casting the shadow of a standing person
    - recently used washbasin in a sealed bedroom, water still circling the drain
    - tea steaming beside a rocking chair after every resident has left the house
    - clean locked door gathering flies while adjacent rooms remain decayed
    - family photograph placed face-down again each time the resident leaves the room
    - snow accumulating across a doorstep except for two bare footprints facing inward

# ------------------------------------------------------------------------
# SCENE ROUTES
# ------------------------------------------------------------------------

  haunting_combo:
    - "__gkr_gothic/haunting_scene__, __gkr_gothic/camera__, __gkr_gothic/lighting__, __gkr_gothic/gothic_tradition__, __gkr_gothic/rendering__"
  psychological_horror_combo:
    - "__gkr_gothic/psychological_scene__, __gkr_gothic/camera__, __gkr_gothic/lighting__, __gkr_gothic/gothic_tradition__, one localized physical anomaly and no surrounding glow, __gkr_gothic/rendering__"
  folk_horror_combo:
    - "__gkr_gothic/folk_horror_scene__, __gkr_gothic/camera__, natural daylight or firelight, __gkr_gothic/rendering__"
  gothic_romance_combo:
    - "__gkr_gothic/gothic_romance_scene__, __gkr_gothic/relationship__, __gkr_gothic/camera__, __gkr_gothic/lighting__, Romantic Gothic, __gkr_gothic/rendering__"
  investigation_combo:
    - "__gkr_gothic/investigation_scene__, __gkr_gothic/investigator_character__, physical evidence clearly visible, __gkr_gothic/camera__, __gkr_gothic/lighting__, __gkr_gothic/rendering__"
  medical_horror_combo:
    - "__gkr_gothic/medical_horror_scene__, __gkr_gothic/camera__, cold practical lighting, __gkr_gothic/rendering__"
  maritime_gothic_combo:
    - "__gkr_gothic/maritime_horror_scene__, __gkr_gothic/camera__, hard coastal weather, __gkr_gothic/rendering__"
  ecclesiastical_gothic_combo:
    - "__gkr_gothic/religious_character__, __gkr_gothic/sacred_environment__, __gkr_gothic/relationship__, one visible ritual disturbance, __gkr_gothic/camera__, __gkr_gothic/lighting__, __gkr_gothic/rendering__"
  supernatural_portrait_combo:
    - "__gkr_gothic/supernatural_character__, full-body figure with one physically impossible trait, plain dark wall, one candle or window light, __gkr_gothic/rendering__"
  quiet_horror_combo:
    - "__gkr_gothic/quiet_horror_scene__, static composition, ordinary material detail, no visible monster, __gkr_gothic/lighting__, __gkr_gothic/rendering__"

