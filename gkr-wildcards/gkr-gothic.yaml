# ========================================================================
# GOTHIC HORROR — VISUAL WILDCARDS FOR COMFYUI
#
# COVERS: Haunted people and places where buried histories return through decaying
# architecture, family secrets, folklore, romance, investigation, and bodily dread.
# Architecture, inheritance, repression, haunting, folklore, mortality,
# romance, investigation, and bodily dread expressed as visible imagery.
#
# Theme core components: visual grammar, character, architecture/environment,
# supernatural pressure, narrative action, and mood; make dread visibly causal.
#
# GLOBAL RULE: Read and apply ./prompt.md (MODE: tags)
# THEME EXTENSION — GOTHIC HORROR
# Prefer haunted architecture, forbidden rooms, candlelit pursuit, doomed romance, investigation,
# bodily dread, folklore and decisive supernatural manifestations. Quiet beauty and oppressive
# stillness are as valuable as overt horror when a visible anomaly anchors the image.
# Example: (rain-soaked heir:1.1), opening a sealed crypt, second shadow rising behind the door.
# Out of scope: abstract family secrets, repression or curses without physical evidence; generic
# gore without gothic material culture; modern political commentary unrelated to the haunting.
#
# ROUTE USAGE
# combo: composes compatible components into one flat, production-ready weighted tag string.
# spotlight: selects a curated, high-specificity concept; preserve its internal logic.
# random: selects one complete route for breadth; avoid stacking random routes.
#
# TAGS-MODE LEAF RULE (see ./prompt.md, MODE: tags, for the full spec)
# Every leaf is a flat, comma-separated list of short tag phrases: subject, defining visible
# action/relationship, setting or props. Weight syntax (term:weight) is the normal way to mark
# priority, typical range 0.8-1.2, reserving 1.3+ or sub-0.8 for elements that must dominate or
# recede; weight only the 1-3 items that matter most per leaf and leave the rest unweighted.
# No full sentences except where a defining relationship cannot survive being split into tags.
# No generic quality fillers, no negative_prompt category, no sequential/multi-panel/page routes.
# A downstream LLM may clarify wording but must not invent the visual representation.
# ========================================================================

gkr_gothic:

# ------------------------------------------------------------------------
# VISUAL GRAMMAR
# ------------------------------------------------------------------------

  gothic_tradition:
    - eighteenth-century literary gothic, ruined estate, candlelit chamber, (sublime landscape:1.1), restrained terror
    - Victorian gothic, mourning customs, gaslit institution, industrial soot, elaborate interior
    - Southern gothic, decaying prosperity, oppressive heat, family relics, overgrown property
    - Romantic gothic, storm landscape, doomed intimacy, pale dawn, (charged architecture:1.1)
    - ecclesiastical gothic, monumental stone nave, overturned altar, cracked reliquary, (extinguished candles:1.1), kneeling priest
    - folk gothic, isolated community, seasonal materials, handmade ritual objects, watchful landscape
    - maritime gothic, salt-damaged buildings, storm signal, drowned objects, black coastal water
    - medical gothic, anatomy theatre, clinical restraint, specimen cabinet, bodily uncertainty
    - urban gaslamp gothic, crowded lodging house, narrow street, class separation
    - modern domestic gothic, ordinary home, inherited objects, architectural repetition, (one impossible detail:1.2)

  camera:
    - distant doorway framing, observer separated from subject
    - symmetrical room frame, (one architectural inconsistency:1.1)
    - close-up hands, letter or key, threat blurred behind
    - low corridor perspective, repeating doors, converging floor pattern
    - high angle, vulnerable figure, monumental architecture
    - static wide shot, subject near a sealed exit
    - over-the-shoulder view, (mismatched reflection:1.2)
    - intimate paired portrait, withheld touch, conflicting eyelines
    - exterior long shot, travelers dwarfed by weather and landscape
    - restrained portrait, single off-frame practical light source

  lighting:
    - weak morning light, dirty lace curtains, rain-drained color
    - single oil lamp, uneven amber falloff, unreadable dark corners
    - overcast daylight, (one unnaturally black doorway:1.2)
    - dying fireplace glow, polished-wood reflection, mostly unlit faces
    - pale winter dusk, flat exterior light, warm windows, no silhouettes
    - lightning flash, (figure revealed for an instant:1.2), tall windows
    - just-extinguished candle, smoke crossing a narrow moonbeam
    - cold institutional skylight, warmer handheld lamp below
    - hard coastal dawn, salt-streaked glass
    - practical gaslight, alternating failed fixtures

  rendering:
    - gothic book illustration, fine crosshatching, restrained sepia wash, generous paper white
    - dark oil painting, visible brushwork, deep earth pigments, controlled candlelight
    - black-and-white wood engraving, carved texture, broad shadow pools
    - faded hand-tinted photograph, soft focus, damaged emulsion edges
    - theatrical gothic melodrama painting, velvet color, expressive staging
    - stark charcoal drawing, erased highlights, rough paper grain
    - cinematic gothic realism, natural material decay, practical lighting, fine film grain
    - ink-wash horror illustration, bleeding edges, one restrained spot color

# ------------------------------------------------------------------------
# GENRE-SAFE CHARACTER FAMILIES
# ------------------------------------------------------------------------

  household_character:
    - grieving estate heir, altered mourning clothes, sealed letter, ring of unfamiliar keys
    - stern housekeeper, inventory ledger, every room key except one
    - aging family solicitor, document case, spectacles, cloth-wrapped portrait
    - child resident, repaired doll matching an old family photograph
    - impoverished aristocrat, maintained formal clothes, visibly decaying room
    - distant relative, one small trunk, knowledge of a forbidden room
    - elderly tenant, decades of correspondence, worn traveling case
    - newly married resident, noticing their likeness in an ancestral portrait

  investigator_character:
    - period detective, notebook, shaded lantern, mud-stained evidence envelope
    - physician, leather diagnostic case, contradictory anatomical sketches
    - skeptical archivist, cotton gloves, magnifying lens, altered parish records
    - occult scholar, chalk, measuring cord, translated ritual fragments
    - coastal constable, tide tables, water-damaged missing-person notice
    - insurance inspector, photographing a fire-damaged manor, (no object actually burned:1.2)
    - journalist, comparing witness statements, wall of family photographs
    - amateur naturalist, tracks beginning as animal prints, ending as bare feet

  religious_character:
    - exhausted exorcist, travel-worn clerical clothing, prayer book, candle, practical restraints
    - conflicted parish priest, damaged reliquary, empty congregation
    - convent gardener, pruning tools, headless saint statues
    - young acolyte, kneeling beside a lifted chapel flagstone, (fresh black soil and pale roots:1.2), candle held close
    - rural ritual keeper, handmade offerings, faded seasonal diagram
    - hospital chaplain, seated beside a patient, (patient's reflection standing:1.2)
    - disgraced theologian, translating marginal notes, forbidden devotional text
    - silent pilgrimage guide, votive tokens from travelers who never returned

  medical_character:
    - anatomy lecturer, stained apron, pointer paused over an impossible specimen
    - asylum nurse, key ring, folded patient drawings
    - village healer, dried herbs, bundle containing human teeth
    - mortuary attendant, pulling open a sealed drawer, (fresh condensation and one handprint on the metal:1.3)
    - surgeon washing instruments, (empty padded operating table visibly dented as if under unseen weight:1.2)
    - rehabilitation patient, stacking wooden blocks, stitched hand, mismatched fingerprint tests
    - apothecary, medicine bottles with exchanged labels
    - undertaker, measuring an apparently empty coffin from the inside

  folk_character:
    - harvest-master, ordinary work clothes, handmade straw mask
    - isolated innkeeper, identical meals, silent local patrons
    - shepherd, bells removed from animals that returned without shadows
    - village bride, inherited flowers dried almost black
    - woodcarver, protective figures resembling recent visitors
    - ferryman, collecting tokens from passengers visible only in the water
    - midwife, woven basket, house every resident avoids
    - traveling musician, regional songs, villagers closing their shutters

  supernatural_character:
    - translucent drowned bride, water-dark dress, weeds in streaming hair
    - pale vampire, old formal clothes, subtle fangs, (no reflection in nearby silver:1.2)
    - revenant, burial clothes, grave soil beneath intact fingernails, one personal token
    - spectral child, indistinct face, (feet fading above the floor:1.2), toy held at side
    - frost-rimmed soldier apparition, incomplete uniform, broken weapon lowered
    - veiled banshee, fabric moving, (every curtain still:1.1)
    - humanlike shadow, edges dissolving against the room light direction
    - stitched creation, heavy work clothes, uncertain expression, careful gentle hands

  relationship:
    - heir reaching for a locked key, housekeeper blocking the door, (lowered gaze:1.1)
    - injured investigator leaning on a witness, one shared lantern, flooded underground passage
    - living spouse pressing a palm to a rain-streaked window, (mirrored spectral gesture in reflection:1.2)
    - parent hiding a blood-marked diary, child pointing at a pale corridor figure
    - physician comparing a newly scarred hand, (identical scar on a restrained patient's hand:1.3)
    - priest holding a scorched reliquary, skeptic measuring the same burn with calipers
    - siblings pulling an inherited locket apart, (portrait side vs hidden-compartment side:1.2)
    - village host pouring tea without smiling, visitor noticing an extra cup for an empty chair

# ------------------------------------------------------------------------
# ENVIRONMENTS AND PHYSICAL SUBJECTS
# ------------------------------------------------------------------------

  domestic_environment:
    - inherited country estate, family portraits turned to the wall, locked west wing
    - sealed nursery, sheet-covered furniture, faded wallpaper, one disturbed toy
    - manor dining room, place set for an absent guest, condensation on one glass
    - narrow boarding-house corridor, identical doors, (misaligned repeating wallpaper:1.1)
    - family portrait gallery, generations of stern faces, one fresh canvas in an antique frame
    - flooded townhouse cellar, floating papers, iron door beneath the water

  institutional_environment:
    - abandoned anatomy theatre, tiered benches, stained table, cloudy specimen cabinets
    - decaying asylum ward, rusted beds, observation windows, patient drawings behind plaster
    - shuttered opera house, dusty velvet seats, (stage curtain moving without a draft:1.2)
    - snowbound railway platform, stopped clock, abandoned luggage, no tracks beyond
    - old courthouse archive, warped shelves, sealed testimony, water seeping from a dry wall
    - charity hospital chapel, empty pews, medical screens, wax footprints ending at the altar

  sacred_environment:
    - crumbling cathedral nave, damaged stained glass, empty pews, (translucent faces in the stone:1.2)
    - overgrown convent garden, headless saints, thorn-choked paths, empty well
    - rural chapel, handmade votive figures, floorboards repaired across eras
    - cliffside monastery, storm bells, salt-damaged manuscripts, sealed lower stairs
    - cemetery ossuary, labeled bones, missing nameplates, one recently opened niche
    - pilgrimage road, barren hills, abandoned offerings, footprints never leaving the path

  folk_environment:
    - remote harvest village, woven effigies above every doorway, fields cut into symbols
    - isolated moorland inn, muddy footprints ending at the stairs, guests facing the door
    - sacred grove, stone altar, votive ribbons, one chair facing away
    - orchard after a wedding feast, identical flower crowns, abandoned shoes at the field edge
    - village well, offerings of hair, toys, folded letters
    - winter procession route, lanterns leading into an unoccupied forest

  maritime_environment:
    - coastal fishing village, low tide, empty boats, bells sounding from offshore
    - storm-battered cliff manor, salt-rotted windows, one dry upper room
    - abandoned lighthouse interior, wet spiral stairs, keeper logs continuing after evacuation
    - wrecked chapel below the tide, weed-covered pews, candles still upright
    - fogbound ferry landing, timetable for a route on no current map
    - sea cave beneath a cemetery, coffin fragments, fresh flowers above the waterline

  gothic_prop:
    - sealed family letter, (handwriting changing midway down the page:1.2)
    - iron key, teeth matching no lock, rust marks on one door
    - mourning portrait, (sitter's hands in a different pose in reflection:1.2)
    - cracked music box, playing only while the lid stays closed
    - medical diagram, layered corrections forming a second anatomy
    - tide ledger, arrivals recorded on nights no boat sailed
    - child's doll, repaired with fabric cut from a burial garment
    - ritual bundle, herbs, hair, teeth, a photograph taken decades later

  creature_subject:
    - corpse moths clustering into the outline of a missing face
    - gaunt antlered animal, motionless at the edge of cultivated land
    - grave hound, exposed ribs packed with roots and cemetery flowers
    - immense pale cave organism, ring of closed eyes, breathing folds
    - house centipede assembled from porcelain doll limbs and human hair
    - black coastal bird carrying strips of burial cloth inland
    - many-jointed figure, (silhouette contradicting the light direction:1.2)
    - living topiary shaped like generations of a family walking toward the house

# ------------------------------------------------------------------------
# AUTHORED VISUAL SCENES
# ------------------------------------------------------------------------

  haunting_scene:
    - resident reading beside a dying fireplace, (unnoticed translucent child at their feet:1.3)
    - wooden horse rocking in a sealed nursery, damp footprints ending beneath the bed
    - family dinner set for an absent guest, every portrait turned toward the empty chair
    - drowned apparition beyond an upper window, (wet handprint appearing on the inside glass:1.3)
    - old woman folding clothes, (empty chair sinking under unseen weight:1.3), lifting dust
    - long corridor, figure motionless at the far end, foreground lamps lit, (distant lamps darkened and smoking:1.2)

  psychological_scene:
    - solitary figure facing a mirror, (reflection turned the wrong direction:1.3)
    - detective comparing two family photographs, same unknown child decades apart
    - patient walking a corridor, every clock showing a different hour
    - woman setting a second teacup opposite an empty chair, (cup already half-empty though untouched:1.3)
    - scholar reading a notebook, open page showing a hand-drawn diagram of the room from a viewpoint inside the wall
    - man returning home, family calmly displaying his funeral portrait

  folk_horror_scene:
    - smiling villagers carrying woven effigies toward a hilltop fire, one outsider held back
    - masked residents circling an empty chair, daylight seasonal rite
    - rural wedding guests, identical crowns, shoes lined at the field edge
    - healer holding an opened charm bundle, (human teeth dropping from dried plants:1.2), white cloth, lamplight
    - traveler sheltering in an inn, every patron reciting the same prayer
    - children replacing village door markings, adults watching from shuttered windows

  gothic_romance_scene:
    - estranged lovers separated by a rain-streaked window, (one visible only in reflection:1.2)
    - widow reading forbidden letters beside an unopened crypt, cold dawn
    - vampire offering a gloved hand in an empty ballroom, attraction and suspicion in posture
    - spectral bride waiting at a ruined altar, aged beloved approaching with a lantern
    - heir uncovering a lost lover's portrait, (bearing their own face:1.3)
    - doomed couple embracing on a cliff, ancestral manor burning far behind

  investigation_scene:
    - detective examining muddy barefoot tracks beginning inside a locked study
    - doctor and constable inspecting a warm bed in an empty sealed room
    - scholar mapping symbols carved beneath village thresholds, watching residents
    - investigators opening a family archive, fresh ink over undisturbed dust
    - coastal priest and detective following wet footprints from the surf toward a hill chapel, (barnacled bell rope around one print, submerged bell visible beneath:1.3)
    - anatomist comparing a missing-person sketch with a face in an unlabeled specimen jar

  medical_horror_scene:
    - surgical team recoiling from an empty operating table, (restraints compressed into a human shape:1.3)
    - patient and physician comparing scans, (two different skeletons at the same time:1.2)
    - anatomy students surrounding a demonstration specimen, (matching branching scar on a student's forearm:1.3)
    - asylum nurse unlocking a room, interior far larger than the building
    - undertaker's measuring rule against a closed coffin, (fresh dents matching the marked measurements:1.3)
    - apothecary arranging bottles, shadows shaped like former patients

  maritime_horror_scene:
    - lighthouse keeper reading a fresh log entry in their own handwriting, storm outside
    - villagers watching empty fishing boats return in formation, low tide
    - ferry passengers waiting for a vessel, (lights visible beneath black water:1.2)
    - cliff-manor residents setting places for relatives lost at sea generations earlier
    - investigator descending into a chapel exposed beneath the retreating tide
    - drowned belongings washed ashore, arranged in the order their owners disappeared

  quiet_horror_scene:
    - ordinary breakfast room, (one chair casting a standing person's shadow:1.3)
    - recently used washbasin in a sealed bedroom, water still circling the drain
    - dust-covered parlor, packed trunks by the open door, (steaming tea beside a blurred rocking chair:1.2)
    - clean locked door gathering flies, adjacent rooms decayed
    - family photograph placed face-down again each time the resident leaves
    - snow across a doorstep, (two bare footprints facing inward:1.2)

# ------------------------------------------------------------------------
# SCENE ROUTES
# ------------------------------------------------------------------------

  haunting_combo:
    - "__gkr_gothic/haunting_scene__, __gkr_gothic/camera__, __gkr_gothic/lighting__, __gkr_gothic/gothic_tradition__, __gkr_gothic/rendering__"
  psychological_horror_combo:
    - "__gkr_gothic/psychological_scene__, __gkr_gothic/camera__, __gkr_gothic/lighting__, __gkr_gothic/gothic_tradition__, (one localized physical anomaly:1.2), no surrounding glow, __gkr_gothic/rendering__"
  folk_horror_combo:
    - "__gkr_gothic/folk_horror_scene__, __gkr_gothic/camera__, natural daylight or firelight, __gkr_gothic/rendering__"
  gothic_romance_combo:
    - "__gkr_gothic/gothic_romance_scene__, __gkr_gothic/relationship__, __gkr_gothic/camera__, __gkr_gothic/lighting__, Romantic gothic, __gkr_gothic/rendering__"
  investigation_combo:
    - "__gkr_gothic/investigation_scene__, __gkr_gothic/investigator_character__, (physical evidence clearly visible:1.1), __gkr_gothic/camera__, __gkr_gothic/lighting__, __gkr_gothic/rendering__"
  medical_horror_combo:
    - "__gkr_gothic/medical_horror_scene__, __gkr_gothic/camera__, cold practical lighting, __gkr_gothic/rendering__"
  maritime_gothic_combo:
    - "__gkr_gothic/maritime_horror_scene__, __gkr_gothic/camera__, hard coastal weather, __gkr_gothic/rendering__"
  ecclesiastical_gothic_combo:
    - "__gkr_gothic/religious_character__, __gkr_gothic/sacred_environment__, __gkr_gothic/relationship__, (one visible ritual disturbance:1.2), __gkr_gothic/camera__, __gkr_gothic/lighting__, __gkr_gothic/rendering__"
  supernatural_portrait_combo:
    - "__gkr_gothic/supernatural_character__, full-body figure, (one physically impossible trait:1.3), plain dark wall, one candle or window light, __gkr_gothic/rendering__"
  quiet_horror_combo:
    - "__gkr_gothic/quiet_horror_scene__, static composition, ordinary material detail, no visible monster, __gkr_gothic/lighting__, __gkr_gothic/rendering__"

