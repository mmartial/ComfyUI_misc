# ========================================================================
# GLOBAL COMICS — USA, EUROPE, AND WORLD TRADITIONS
#
# COVERS: Comics as sequential art re-expressed as single-image tag leaves —
# classic superhero design, region-specific drawing/coloring traditions,
# genre-safe character families, US/European/World comics traditions, and
# production/design-sheet output formats.
#
# Medium-first wildcard library, tags-mode authoring.
#
# Theme core components: classic superhero generator, page-craft rendering
# style, genre-safe character families, regional comics traditions, and
# production-asset output sheets; keep medium and genre signals aligned.
#
# GLOBAL RULE: Read and apply ./prompt.md (MODE: tags)
# THEME EXTENSION — GLOBAL COMICS
# Prefer iconic genre moments, readable character acting, decisive action, strong
# silhouettes, and region-specific drawing/coloring traditions expressed as compact
# weighted tag clusters (subject + defining action/relationship + setting), not prose.
# Comic-book ink/halftone/panel-border framing may appear only as a style tag on an
# ordinary single-image leaf (e.g. a "dynamic split panel" border framing one pose) —
# never as multi-panel storytelling, page-turn reveals, or before/after sequences,
# which have no flat-tag equivalent per prompt.md Tags Mode and are not authored here.
# Example: (caped hero:1.1), bracing collapsed beam overhead, panicked civilians below,
# low-angle splash framing.
# Out of scope: named copyrighted characters, unsupported regional labels, panel-by-panel
# page grammar, multi-page pacing, negative prompts, and quality-filler tags.
#
# ROUTE USAGE
# combo: Composes compatible components into a coherent, production-ready tag string.
# spotlight: Selects a curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
#
# Generator specifc entries:
# DO_NOT_USE_TAGS: [comic, western_comics_(style)]
# CANONICAL_POLICY: prefer
#
# GENERATOR: THEME: Global comics across US, European, and world traditions.
#
# GENERATOR: Keep ordinary routes single-image and tags-mode. Panel borders may frame one moment, but do not generate multi-panel storytelling, page sequences, before-and-after layouts, or page-turn reveals.
# GENERATOR: Avoid named copyrighted characters, creators, franchises, imitation of living artists, negative prompts, and generic quality filler.
# GENERATOR: Prefer a small, connected category graph. Add only supporting combo and cover categories needed to connect the required pools to public routes.
# ========================================================================

