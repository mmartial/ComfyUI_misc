# US COMICS TRADITIONS
# ------------------------------------------------------------------------

  us_scene:
    - neighborhood hero lifting a collapsed beam from trapped civilians while a fleeing masked antagonist recedes beneath a collapsing elevated train
    - horror-anthology heir holding two dated family portraits side by side, an extra pale relative visible only in the newer photograph
    - noir investigator entering an empty nightclub where one telephone rings beside untouched drinks
    - Western town confronting a railroad company through contracts, sabotage and a tense station-platform standoff
    - wartime medic crossing a ruined street to reach civilians while official orders demand retreat
    - romance-comic coworkers reaching simultaneously for the same award file, competitive glares above matching private praise notes tucked into their folders
    - teen ensemble inside a threatened local venue, demolition notice on the door, one group building a benefit stage while another paints protest signs, former friends working back-to-back without eye contact
    - funny-animal neighborhood election escalating through visual misunderstandings and an unexpectedly sincere concession
    - underground-comix musician watching a familiar district become unaffordable between successive gigs
    - autobiographical creator revisiting a family argument through contradictory remembered layouts of one kitchen
    - newspaper adventurer at a foreign port comparing a rain-damaged map with official signs pointing the wrong way while a local guide marks a hidden route toward visible hills
    - children's science club solving a local environmental problem through observation and improvised experiments

