# ========================================================================
# GLOBAL COMICS — USA, EUROPE, AND WORLD TRADITIONS
# Medium-first, sequential-storytelling wildcard library.
# ========================================================================

gkr_comics:

# ------------------------------------------------------------------------
# PAGE CRAFT
# ------------------------------------------------------------------------

  page_grammar:
    - clear establishing panel, approach, action, reaction and consequence across three tiers
    - nine-panel grid using repeated framing and small changes in posture or background
    - full-page reveal preceded by narrow scale-reference and reaction panels
    - double-page environment spread with inset panels tracking individual discoveries
    - page-turn reveal placed at the first panel of the right-hand page
    - dialogue sequence using shot-reverse-shot, hand details and one silent reaction panel
    - parallel montage intercutting two locations through matched shapes and gestures
    - irregular expressive gutters that preserve an unmistakable reading order
    - four equal panels with setup, reinforcement, reversal and silent payoff
    - vertical-scroll episode paced through long negative spaces and anchored close-ups
    - tiered European album page, broad establishing panels and detailed environmental continuity
    - caption-led sequence alternating documentary evidence with observed human reactions

  lettering:
    - hand-lettered dialogue balloons, varied emphasis, tails placed without covering faces or actions
    - restrained rectangular narration boxes with generous margins and consistent reading order
    - expressive brush sound effects integrated into debris, weather and movement
    - mechanical uppercase lettering suited to vintage newsprint reproduction
    - elegant mixed-case balloons with ample breathing room for literary dialogue
    - multilingual signage and dialogue with distinct but harmonious lettering treatments
    - caption-free silent sequence relying on eyelines, gestures and repeated visual motifs
    - digital vertical-scroll lettering sized for phone reading with clear balloon hierarchy

  line_treatment:
    - bold brush contours, broad spot blacks and controlled feathering
    - fine uniform clear-line drawing with detailed architecture and uncluttered silhouettes
    - dense crosshatching, dry-brush shadows and worn paper texture
    - loose autobiographical pencil and ink with visible corrections
    - expressive charcoal, torn-paper collage and photocopied textures
    - elegant pen line, decorative fabric folds and restrained facial detail
    - woodcut-like marks, carved silhouettes and limited tonal modeling
    - fluid calligraphic brushwork with ink-wash atmosphere
    - precise mechanical linework and large painted environmental shapes
    - clean webtoon contours, restrained gradients and readable mobile silhouettes

  color_process:
    - vintage newsprint palette, visible registration drift and coarse halftone dots
    - saturated flat color with limited shadow shapes and bright paper white
    - muted watercolor washes over visible ink lines
    - painted gouache panels with modeled light and opaque texture
    - limited two-color risograph palette with overlapping ink artifacts
    - black and white with screentone, spot blacks and selective white correction
    - European album color, natural materials, atmospheric distance and clear local color
    - luminous digital color restrained by strong ink hierarchy
    - earth pigments and textile-inspired pattern accents
    - monochrome ink wash with one narrative spot color

  publication_format:
    - stapled monthly comic issue, 20-page pacing and strong final-page hook
    - Sunday newspaper page with large opening panel and several linked strips
    - daily newspaper strip with economical backgrounds and precise final-panel timing
    - large-format European album with 48-page adventure pacing
    - black-and-white pocket-format serial with dense page economy
    - weekly anthology installment ending on a sharp cliffhanger
    - literary graphic novel chapter with patient transitions and recurring motifs
    - handmade mini-comic with photocopied textures and personal lettering
    - vertical-scroll webcomic episode designed for phone reading
    - educational or documentary comic combining diagrams, testimony and observed scenes

# ------------------------------------------------------------------------
# GENRE-SAFE CHARACTER FAMILIES
# ------------------------------------------------------------------------

  superhero_archetype:
    - neighborhood rescuer in a handmade practical costume, repair seams and compact first-aid kit visible
    - veteran public hero wearing ceremonial colors over impact-resistant work gear
    - non-powered investigator using climbing equipment, field notes and careful preparation
    - cosmic guardian whose translucent silhouette contains a painted starfield, solemn rather than triumphant
    - former villain performing community service in a visibly altered version of an old costume
    - young legacy hero adapting an inherited emblem to a different body, neighborhood and responsibility
    - emergency engineer in powered rescue armor with lifting tools and high-visibility markings
    - shapeshifting protector whose clothing and posture preserve identity across forms

  pulp_crime_archetype:
    - private investigator in a cheap rain-dark suit, case file and camera, fatigue visible in posture
    - nightclub singer quietly collecting evidence between performances
    - reforming safecracker carrying ordinary locksmith tools and one concealed old habit
    - investigative reporter with notebook, transit map and damaged press camera
    - weary homicide detective balancing procedure against political pressure
    - neighborhood witness who notices patterns professionals dismiss
    - defense attorney reconstructing a crime through records and contradictory testimony
    - organized-crime accountant carrying ledgers more dangerous than a weapon

  everyday_archetype:
    - multigenerational shopkeeper surrounded by inventory, family photographs and unpaid bills
    - schoolchild with an elaborate private project hidden inside an ordinary backpack
    - middle-aged office worker documenting small changes in a familiar commute
    - retired factory worker organizing a neighborhood archive
    - immigrant restaurant owner translating between family, staff and municipal paperwork
    - touring musician carrying damaged equipment through a changing city
    - nurse ending a night shift as the household begins its morning
    - elderly tenant resisting displacement with records, memory and community support

  adventure_archetype:
    - clear-line young reporter with notebook, practical coat and expressive animal companion
    - aviation mechanic turned reluctant expedition pilot, maps and repair tools close at hand
    - maritime cartographer documenting an island omitted from official charts
    - archaeological translator challenging the assumptions of a celebrated explorer
    - desert caravan guide reading weather, trade custom and terrain
    - railway courier protecting documents during a border crisis
    - naturalist sketching unfamiliar creatures without treating them as monsters
    - teenage inventor whose clever vehicle fails in understandable mechanical ways

  historical_archetype:
    - wartime motorcycle courier carrying civilian messages through a damaged railway junction
    - medieval manuscript artist witnessing political events excluded from official chronicles
    - nineteenth-century labor organizer distributing a clandestine illustrated newspaper
    - court interpreter navigating diplomacy across several languages and customs
    - rural healer preserving regional knowledge during forced modernization
    - postwar printer rebuilding a neighborhood press from salvaged machinery
    - sailor documenting colonial trade from the viewpoint of the recruited crew
    - family archivist confronting omissions in an inherited public history

  speculative_archetype:
    - orbital gardener maintaining a dying ecosystem inside a damaged habitat
    - obsolete service robot carrying handwritten requests from former users
    - city planner mapping neighborhoods that appear only during electrical outages
    - folkloric guardian negotiating with residents rather than fighting them
    - climate refugee repairing communications across floating settlements
    - dream investigator cataloging recurring architecture across unrelated sleepers
    - post-apocalyptic librarian trading practical knowledge between isolated communities
    - scientist discovering an alien artifact designed for an ordinary domestic task

  ensemble_role:
    - coordinator maintaining the whole plan under pressure
    - skeptical observer testing the group's assumptions
    - local guide interpreting custom and place
    - technical specialist solving material constraints
    - emotional mediator noticing what remains unspoken
    - impulsive initiator forcing a necessary decision
    - experienced defender protecting retreat and civilians
    - newcomer asking the question experts have normalized away

  relationship:
    - protagonist and rival whose respect complicates the conflict
    - parent and adult child rebuilding trust through shared work
    - mentor and successor divided over whether tradition permits change
    - siblings assigning opposite meanings to the same family history
    - investigator and witness becoming mutually dependent
    - former lovers forced into a practical collaboration
    - community leader and outsider slowly exchanging expertise
    - creator and subject disagreeing over who owns a recorded story

