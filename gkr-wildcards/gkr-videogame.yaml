    - mid-1980s 8-bit console presentation, crisp tile maps, small expressive sprites, flat color clusters and simple status panel
    - early-1990s 16-bit console presentation, layered parallax scenery, detailed sprite animation, saturated palette and compact HUD
    - early-1990s arcade presentation, oversized hand-drawn sprites, elaborate backgrounds, dramatic hit sparks and cabinet-screen clarity
    - mid-1990s polygonal presentation, low-resolution textures, angular character models, vertex lighting and hardware-era fog
    - late-1990s pre-rendered presentation, fixed camera, painted background plate and low-poly character model
    - early-2000s console presentation, stylized low-poly forms, baked lighting, compact textures and strong silhouette design
    - mid-2000s high-definition presentation, normal-mapped surfaces, bloom, desaturated grading and cinematic letterboxing
