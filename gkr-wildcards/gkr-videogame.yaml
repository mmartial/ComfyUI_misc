# ========================================================================
# Video Game — EXTENDED WILDCARDS FOR COMFYUI DYNAMIC PROMPTS
#
# GLOBAL RULE: Read and apply ./prompt.md (MODE: tags)
#
# COVERS: Video-game characters, worlds, genres, eras, gameplay situations, cameras,
# interface cues, promotional key art, and iconic AAA-archetype moments, expressed as
# flat comma-separated tag phrases with (term:weight) emphasis — no prose, no panels.
#
# THEME EXTENSION — VIDEO GAMES
# Prefer recognizable gameplay moments, boss confrontations, traversal, racing, discovery,
# combat, puzzle interaction, character selection and promotional key art. Make game
# language visible through camera, level structure, interactable objects and restrained
# interface cues (health bars, minimaps, HUD icons) as single-frame overlays only.
# Out of scope: mechanics described without visible interaction, excessive HUD text, named
# game or character imitation (use generic archetypes, not proper names), and sequential
# storyboard/multi-panel/cutscene routes — this theme's single-image rendering signatures
# (retro 8-bit/16-bit pixel look, cinematic key-art rendering) are kept only as style tags
# applied to ordinary single-image leaves, per prompt.md's Tags Mode rule.
#
# ROUTE USAGE
# combo: Composes compatible components into one coherent weighted-tag prompt.
# spotlight: Curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
# ========================================================================

