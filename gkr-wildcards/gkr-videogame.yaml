    - city-builder mayor overlooking a metropolis recovering after disaster, cranes and temporary homes filling the sunrise skyline
    - colony leader opening sealed doors to share dwindling heat with newly arrived refugees during a blizzard
    - farmer discovering that a supposedly dead orchard has blossomed overnight around a small magical visitor
    - cozy shopkeeper placing the first handmade sign above a newly restored storefront as neighbors gather
    - puzzle-game explorer watching an impossible chamber unfold into open sky after the final mechanism aligns
    - platform mascot reaching the summit only to find the rescued rival calmly waiting with a picnic
    - tiny robotic companion using its last power to open a path through a collapsing factory
    - artificial intelligence choosing a humble maintenance body after rejecting a monumental war machine
    - cybernetic mercenary standing in an elevator as every mirrored reflection shows a different past decision
    - hacker broadcasting hidden evidence across every public screen while authorities close in on the rooftop transmitter
    - detective and suspected android recognizing matching childhood memories across an interrogation table
    - post-apocalyptic caravan entering a green valley believed to be a myth, vehicles stopping one by one in silence
    - scavenger finding a working arcade cabinet deep inside a ruined city and watching its title screen illuminate the room
    - wasteland factions lowering weapons as long-dormant rain begins falling across the battlefield
    - pirate crew seeing a legendary ghost ship rise beneath moonlit waves, torn sails filling without wind
    - explorer escaping a collapsing jungle temple by sliding beneath a closing stone gate with the recovered artifact
    - archaeologist translating the final mural and realizing the depicted destroyer is the expedition itself
    - time traveler meeting an older version of the party at a ruined monument they have not yet built
    - player character approaching a final choice represented by two open doors while companions wait without speaking

