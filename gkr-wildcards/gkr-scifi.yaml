# ========================================================================
# SCIFI — TAGS-MODE WILDCARDS FOR COMFYUI DYNAMIC PROMPTS
#
# COVERS: Speculative people, societies, sciences, worlds, spacecraft, and encounters,
# from grounded futures to space opera, with technology tied to visible consequences.
#
# Theme core components: character/biology, role, technology, spacecraft,
# world/environment, speculative premise, and visual tradition; enforce causality.
#
# GLOBAL RULE: Read and apply ./prompt.md (MODE: tags)
# THEME EXTENSION — SCIENCE FICTION
# Prefer visible speculative wonder: alien ecologies, spacecraft operations, strange artifacts,
# exploration, rescue, first contact, cosmic scale and technology performing an understandable
# function. Grounded futures and exuberant space opera are both valid.
# Example: (suited explorer:1.1), extending sample tray, alien organism, landed craft
# Out of scope: speculative politics or scientific claims without visible consequences, invented
# geopolitics, generic glowing technology, and incompatible biology/equipment combinations.
#
# ROUTE USAGE
# combo: Composes compatible components into a coherent, production-ready prompt.
# spotlight: Selects a curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
#
# TAGS-MODE LEAF RULE
# Every leaf is a flat, comma-separated list of short tag phrases (1-4 words each), not a
# sentence. Weight the 1-3 items that matter most with (term:weight), typical range 0.8-1.2,
# reserving 1.3+/sub-0.8 for standout items. Compress subject + defining action/relationship +
# setting into compact weighted tag clusters. No sequential/multi-panel/multi-page routes; a
# theme medium's single-image rendering signature may survive as a style tag only.
#
# NON-LEAF / COMPOSITE RULE
# Router-only items contain wildcard references only. Literal text added by a composite must
# itself be diffusion-ready tags. Every possible referenced pairing must remain visually
# compatible; do not combine broad pools when subject, setting, era, equipment, scale or format
# can conflict.
# ========================================================================

