# ---------------------------------------------------------
# SCIENCE-FICTION TRADITIONS & VISUAL OUTPUTS
# ---------------------------------------------------------

  visual_tradition:
    - hard science fiction, physically motivated spacecraft, pressure systems, thermal radiators, practical workwear and restrained instrument light
    - operatic far future, monumental fleets, ceremonial cultures, vivid planetary horizons and heroic widescreen staging
    - planetary romance, exotic landscapes, elegant expedition clothing, ancient ruins and painterly adventure composition
    - 1950s pulp science fiction, saturated primary colors, painted highlights, halftone texture and theatrical rocket design
    - analog cassette futurism, molded control panels, monochrome displays, labeled switches, fabric uniforms and warm practical lamps
    - clean optimistic retrofuture, white geometric structures, public technology, landscaped habitats and bright diffuse daylight
    - cybernetic near future, dense infrastructure, wearable interfaces, prosthetics and grounded urban documentary lighting
    - biopunk, grown architecture, translucent membranes, engineered organisms and wet laboratory materials
    - ecological science fiction, climate-adapted settlements, restored ecosystems, visible water systems and renewable infrastructure
    - posthuman far future, unfamiliar bodies, distributed cognition, minimal artifacts and immense temporal scale
    - military science fiction, modular armor, logistics, damaged machinery and disciplined ensemble staging
    - scientific exploration, field instruments, samples, protective equipment and visually legible procedures
    - first-contact drama, cautious body language, translation tools, environmental separation and balanced group composition
    - cosmic horror, small figures, incomprehensible structures, weak local light and oppressive negative space
    - generation-ship society, layered lived-in interiors, agriculture, maintenance infrastructure and multigenerational communities
    - megastructure fiction, tiny vehicles against engineered planetary-scale geometry and deep atmospheric perspective

  character_output_format:
    - full-body profession design with readable clothing, tools, body requirements and one contextual setting element
    - coordinated three-person crew portrait with distinct roles, silhouettes and equipment
    - waist-up cinematic portrait emphasizing physiology, material wear and one functional device
    - active working portrait showing hands, instruments, samples and a visible procedure
    - spacesuit or protective-clothing design sheet with front, rear, helmet and life-support details
    - diplomatic portrait showing two visibly different beings with translation equipment and respectful spatial staging

  ship_output_format:
    - spacecraft hero view showing the complete silhouette, propulsion, radiators, access points and operating environment
    - orthographic spacecraft sheet with top, side, front and mechanical-detail views on a neutral background
    - spacecraft cutaway showing crew spaces, cargo, tanks, engines and pressure boundaries
    - mission-operation scene with crew, docking hardware or surface equipment establishing scale
    - analog mission photograph with restrained color, fine grain and physically plausible lighting
    - retrofuturist travel poster presenting the vehicle and destination with simplified geometric composition

  environment_output_format:
    - wide planetary landscape with a small expedition team establishing scale and environmental conditions
    - street-level habitat scene with foreground activity and layered infrastructure
    - architectural cutaway showing pressure zones, circulation, utilities and inhabited rooms
    - orbital panorama with physically motivated sunlight, planetary shadow and recognizable construction scale
    - environmental concept sheet showing exterior, interior and material details from one coherent location
    - archaeological reconstruction pairing the discovered remains with a restrained visualization of their original form

  science_output_format:
    - scientific field procedure with instruments, samples, protective equipment and visible recorded results
    - laboratory process showing hands, containment, analytical tools and a clear specimen
    - mission-control view with coordinated operators, readable status displays and one central event
    - technical plate with cutaway diagrams, scale references and labeled functional components
    - documentary research photograph with practical lighting and observational composition
    - scientific-romance illustration balancing precise instruments with an immense unfamiliar environment

  society_output_format:
    - civilian daily-life scene with natural gestures, personal objects and visibly speculative infrastructure
    - multigenerational household scene inside a lived-in habitat
    - public-space ensemble showing varied occupations, bodies and accessibility systems
    - civic documentary still with restrained lighting and layered social activity
    - cultural ceremony staged around a clearly visible object, practice or environment
    - future editorial illustration with a strong social focal point and controlled symbolic details

# ---------------------------------------------------------
# CHARACTERS — BIOLOGY- AND ROLE-SAFE SCENARIOS
# ---------------------------------------------------------

  human_profession_scenario:
    - orbital construction engineer in a compact maneuvering suit, anchoring a replacement radiator panel to a station truss, tether reels and hand controls clearly visible
    - planetary geologist in a dust-sealed field suit, measuring layered mineral strata with a core sampler and spectral camera beneath a pale double-star sky
    - mission controller in practical office clothing, coordinating a tense orbital insertion from a curved console of restrained status displays
    - xenobiologist in translucent protective sleeves, documenting a small alien organism inside a portable field enclosure without touching it
    - habitat physician using a flexible diagnostic scanner on an elderly patient in a compact clinic, medication printer and handrails visible
    - terraforming ecologist servicing atmospheric sensors among young engineered trees, water-recovery channels and distant habitat domes in view
    - propulsion technician inspecting ceramic heat shielding and fuel couplings beneath a landed shuttle, maintenance cart and safety markings nearby
    - first-contact linguist comparing gesture diagrams with unfamiliar visitors across a transparent environmental partition
    - lunar mining surveyor operating a ground-penetrating radar sled beside exposed ice deposits, harsh unfiltered sunlight and deep shadows
    - agricultural systems worker pruning dwarf fruit trees inside a rotating habitat farm, irrigation lines and curved horizon clearly visible
    - deep-ocean researcher in a pressure suit, sampling microbial mats through a submersible airlock under cold blue work lights
    - interplanetary courier securing cargo modules inside a compact transfer craft, worn flight clothing and handwritten route notes visible

  adapted_human_scenario:
    - low-gravity adapted person with elongated limbs moving through a tall orbital garden, using handrails designed for three-dimensional circulation
    - radiation-adapted maintenance worker with visibly melanized skin and protective eye membranes, inspecting exterior shielding through a service lock
    - aquatic-adapted human with neck gills and webbed hands tending kelp bioreactors inside a flooded research habitat
    - cold-world adapted explorer with compact build and insulated facial membranes, calibrating instruments beside a methane-ice fissure
    - genetically tailored desert settler with reflective eye protection and heat-dissipating skin patterns, repairing a water condenser at dawn
    - microgravity-born musician using foot restraints and a spherical string instrument in a softly lit station commons

  synthetic_person_scenario:
    - maintenance android with ceramic shell panels and exposed service joints, replacing a damaged cable bundle inside a cramped station conduit
    - synthetic diplomat with a matte composite face and subtle expression display, presenting a shared star map to an interspecies council
    - archival intelligence embodied in a mobile library unit, projecting retrieved family records for an elderly habitat resident
    - soft-bodied medical robot wrapping flexible manipulators around a surgical instrument tray, preparing a clean procedure room
    - autonomous field rover unfolding sampling arms beside unfamiliar crystalline growths while remote researchers observe from a pressurized vehicle
    - decommissioned military android teaching mechanical repair in a civilian workshop, old armor mounting points visible beneath practical clothing
    - distributed artificial intelligence represented through coordinated maintenance drones tending an orbital garden without a humanoid avatar
