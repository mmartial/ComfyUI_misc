    - flooded coastal ruin, rooftops above dark water, improvised docks and salt-corroded towers
    - toxic marsh, dead cypress trunks, oily rainbow film and low green vapor
    - overgrown temperate city, trees splitting asphalt, vine-covered apartments and dappled sunlight
    - scorched canyon country, layered red cliffs, wreckage caught in gullies and a narrow riverbed
    - storm grassland, waist-high dry grass, overturned pylons and black shelf clouds
    - volcanic waste, basalt fields, sulfur vents and orange light beneath smoke
    - ruined alpine pass, avalanche debris, abandoned tunnels and distant broken cable cars
    - dry seabed, stranded ships, salt-crusted reefs and navigation buoys leaning in dust
    - subterranean utility maze, wet concrete, cable galleries and pools beneath emergency lamps
    - orbital-debris wasteland, fallen capsules, scorched panels and metallic fragments across tundra
    - tropical storm ruin, flooded streets, snapped palms and bright vegetation reclaiming hotels
    - glass desert, fused rippling ground, prismatic shards and stark black wreckage

  settlement:
    - fortified water-trading town built around purification tanks, shade cloth and guarded pipework
