    - resource-war frontier, blasted pipelines, fortified wells and fuel convoys crossing open ground
    - asteroid-impact winter, impact glass, ash-dark daylight and a fractured horizon
    - solar-flare collapse, burned electrical substations, silent satellites and improvised analog equipment
    - toxic-industrial collapse, corroded chemical works, luminous runoff and sealed breathing apparatus
    - slow societal abandonment, weathered infrastructure, reclaimed streets and hand-painted community signs
    - supernatural cataclysm, impossible storm scars, luminous fissures and ritual shelters
    - far-future ruin cycle, ancient megastructures reduced to mineral-like skeletons beneath a changed sky

  wasteland_biome:
