    - canyon fortress carved into rock, lookout nests, switchback stairs and reinforced doors
    - derelict shopping-mall settlement, balcony homes, hanging banners and a central barter floor
    - solar farm outpost, mirrored panels, battery sheds and dust screens around living quarters
    - bridge settlement suspended above dangerous ground, welded cabins and narrow guarded walkways
    - reclaimed monastery refuge, stone courtyards, medicinal gardens and discreet defenses
    - icebound research-station haven, insulated modules, tracked transports and amber windows
    - river-barge community, linked patched vessels, floating gardens and tall signal masts

  wasteland_creature:
    - lean two-headed desert hound with scarred hide, dust-coated paws and alert mismatched eyes
    - translucent cave crawler with long jointed limbs, pale organs visible beneath its skin
    - armored burrowing reptile erupting through salt crust, shovel-like claws and layered stone-colored scales
