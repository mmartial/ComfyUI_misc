# WASTELAND THEMES & VISUAL FORMATS
# ---------------------------------------------------------

  collapse_origin:
    - nuclear aftermath, glassed ground, distant crater rims and radiation-warning relics
    - climate-collapse badlands, abandoned flood barriers, dry reservoirs and bleached concrete
    - ecological collapse, dead forests, invasive thorn growth and empty agricultural machinery
    - pandemic aftermath, sealed checkpoints, faded quarantine markings and deserted clinics
