    - retro paperback apocalypse cover, painted action, weathered typography space and bold horizon
    - analog documentary photograph, natural grain, available light and unstaged survival detail
    - isometric settlement cutaway, readable circulation, defenses, workshops and water infrastructure
    - panoramic matte painting, layered atmospheric depth and a small human scale reference
    - environmental storytelling still life, worn tools, ration packaging, maps and accumulated dust

