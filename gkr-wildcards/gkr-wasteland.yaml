    - frost-coated mutant wolf with thick patchy fur, vapor breath and crystal growths along its spine
    - territorial rooftop ape using road signs as armor, powerful hands and a nest of bright scavenged objects

  survival_activity:
    - carefully filtering muddy water through cloth, charcoal and salvaged laboratory glass
    - crossing an exposed highway while a wall of dust approaches across the plain
    - repairing a cracked solar panel on a rooftop above an overgrown city
    - bartering medicine for batteries at a crowded settlement gate
    - lowering a lantern into a newly opened bunker shaft
    - salvaging copper cable from a collapsed substation during an electrical storm
    - defending a water convoy at a narrow canyon choke point
    - mapping radiation hot spots with a hand-built detector and marked paper chart
    - guiding pack animals across a frozen reservoir toward amber settlement lights
    - tending vegetables beneath improvised greenhouse lamps inside a bunker
    - searching a flooded hospital from a narrow handmade raft
    - raising a radio antenna as distant signal lights answer on the horizon
    - dismantling a dormant war machine while lookouts watch the ridgeline
    - sheltering beneath a wrecked aircraft wing during acid rain

  wasteland_output_format:
    - cinematic post-apocalyptic keyframe, realistic materials, clear silhouettes and environmental storytelling
