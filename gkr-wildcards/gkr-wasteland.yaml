    - massive irradiated elk with asymmetrical antlers, luminous fungal growth and a solemn stance
    - feral tunnel-dweller with light-sensitive eyes, chalk-pale skin and scavenged cloth wrappings
    - bioengineered pack beast with broad padded feet, breathing tubes and cargo harness scars
    - swamp amphibian with algae-covered armor plates, inflated throat sac and reflective eyes
    - autonomous hunter drone with sand-scoured casing, folding legs and a narrow red sensor slit
    - colony of luminous insects flowing through ruins like a ribbon of green light
