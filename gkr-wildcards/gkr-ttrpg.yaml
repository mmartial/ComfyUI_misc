# --------------------------------------------------------------
#  GENRE TRADITIONS & TABLETOP VISUAL FORMATS
# --------------------------------------------------------------

  fantasy_tradition:
    - grounded low fantasy, weathered equipment, muddy roads, practical clothing, restrained magic and natural overcast light
    - heroic high fantasy, monumental architecture, polished heraldry, luminous magic and sweeping cinematic composition
    - swords-and-sorcery adventure, muscular silhouettes, dangerous ruins, jewel-toned treasures and deep painted shadows
    - swords-and-sandals myth, bronze arms, sun-bleached stone, linen and wool garments, windblown Mediterranean landscape
    - dark fantasy, corroded armor, diseased landscapes, oppressive silhouettes and narrow pools of cold light
    - folkloric fantasy, regional textiles, handmade tools, intimate woodland settings and subtle supernatural signs
    - fairy-tale fantasy, symbolic forests, theatrical castles, vivid color and clear storybook staging
    - chivalric romance, heraldic armor, courtly costume, flowering landscapes and illuminated-manuscript detail
    - dungeon-crawl fantasy, practical expedition gear, cramped stone spaces, torchlight and clearly visible hazards
    - arcane academy fantasy, layered robes, instruments, libraries, demonstration halls and controlled spell effects
    - nautical fantasy, weathered ships, salt-stained clothing, sea monsters, storm light and crowded working decks
    - desert fantasy, layered sun-protective garments, carved sandstone cities, bright mineral colors and heat haze
    - northern saga fantasy, timber halls, wool and fur layers, carved ornament, snow glare and firelit interiors
    - tropical ruin fantasy, dense vegetation, wet stone, vivid birds, river travel and ancient monumental sculpture
    - planar fantasy, impossible horizons, floating terrain, altered gravity and small figures establishing cosmic scale

  character_output_format:
    - full-body player-character design with readable silhouette, class-defining equipment and restrained background
    - waist-up character portrait emphasizing face, ancestry, material wear and one meaningful prop
    - front-and-rear costume sheet showing armor layers, closures, packs and weapon carry
    - character progression triptych showing novice, experienced and veteran versions of the same adventurer
    - paired character portrait emphasizing complementary roles and contrasting silhouettes
    - heroic cover portrait with clear title space, diagonal pose and environmental storytelling

  party_output_format:
    - coordinated party lineup with each member's role, scale and equipment readable at a glance
    - cinematic ensemble key art with distinct silhouettes and a shared threat in the environment
    - campsite group scene with natural interaction, packs, bedrolls, food and watch duties visible
    - tactical encounter tableau with party positions, terrain elevation and immediate objectives clearly staged
    - tavern or guild-hall group portrait showing relationships through posture and small gestures
    - travel panorama with the party small against a vast destination landscape

  monster_output_format:
    - bestiary plate with full-body profile, scale reference, tracks and one anatomical detail inset
    - cinematic monster encounter with adventurers providing scale and a clearly readable environment
    - creature anatomy study with front, side, movement pose and material close-up
    - boss reveal from a low viewpoint with environmental damage establishing size and ability
    - folkloric field-guide illustration with habitat plants, handwritten observations and restrained ornament
    - monster token portrait with centered head-and-shoulders silhouette and simple contrasting backdrop

  scene_output_format:
    - wide establishing environment with foreground path, middle-ground landmark and distant destination
    - encounter-map perspective with readable paths, cover, elevation and interactive terrain
    - cinematic adventure still focused on one decisive action and clearly staged participants
    - storybook double-page illustration with visual room for narration and layered discoveries
    - painted campaign-setting panorama with settlements, roads and landmarks connected visibly
    - illuminated-manuscript scene with flattened perspective, ornate border and mineral-pigment colors

  tabletop_artifact_format:
    - illustrated magic-item card with isolated object, material detail, scale reference and restrained ornamental border
    - parchment bestiary page with creature profile, tracks, habitat vignette and handwritten field notes
    - regional fantasy map with coastlines, settlements, roads, ruins and heraldic cartouche
    - dungeon map rendered as a clean top-down stone floor plan with doors, hazards and furnishing silhouettes
    - heraldic faction plate showing banner, shield, colors, rank badges and ceremonial equipment
    - tavern notice-board composition with quest posting, wax seals, sketches and overlapping local messages

  magic_item_output_format:
    - illustrated magic-item card with isolated object, material detail, scale reference and restrained ornamental border
    - equipment design sheet with front, side, grip or closure detail and a small in-use vignette
    - treasure-hoard still life with the item clearly separated among coins, textiles and mundane expedition gear
    - illuminated catalogue plate with a centered object, handwritten provenance and decorative mineral-pigment border
    - cinematic discovery scene with gloved hands lifting the item from a fitted reliquary
    - merchant-counter product study with appraisal tools, protective cloth and one scale reference

