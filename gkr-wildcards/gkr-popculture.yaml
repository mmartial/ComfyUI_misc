# ========================================================================
# POPCULTURE — EXTENDED WILDCARDS FOR COMFYUI DYNAMIC PROMPTS
#
# COVERS: Popular-culture modes across film, television, music, print, advertising,
# celebrity, fandom, and internet culture without copying specific works.
#
# Theme core components: source medium, genre, era, cultural mode, subject,
# scene language, and output format; build recognizable types without imitation.
#
# ROUTE USAGE
# combo: Composes compatible components into a coherent, production-ready prompt.
# spotlight: Selects a curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
#
# DIFFUSION-READY TRANSFORMATION RULE
# Every generated leaf must already describe an image without requiring interpretation:
# subject + visible pose/action + concrete setting/props + composition/light when useful.
# Replace motives, backstory, relationships, themes, causality and time-based change with
# observable evidence. Use gestures, eyelines, documents, screens, damage, clothing, objects
# and spatial contrast. Use explicit panels/storyboards for concepts needing multiple moments.
# A downstream LLM may clarify wording but must not invent the visual representation.
#
# NON-LEAF / COMPOSITE RULE
# Router-only items contain wildcard references only. Literal text added by a composite must
# itself be diffusion-ready. Every possible referenced pairing must remain visually compatible;
# do not combine broad pools when subject, setting, era, equipment, scale or format can conflict.
#
# SINGLE-IMAGE VISUAL REPRESENTATION TEST
# Write every scene as facts visible in one generated image. A viewer without a caption must be
# able to identify the subject, action and important contrast from pose, placement, props, short
# readable labels, screens, clothing, architecture, damage or lighting. Do not depend on motives,
# memories, recognition, ownership, occupation, causality, past/future events, sound or institutional
# meaning unless their evidence is shown. Replace each such fact with visible proof; when one frame
# cannot show it clearly, explicitly use a diptych, sequential panels, storyboard or contact sheet.
# ========================================================================

