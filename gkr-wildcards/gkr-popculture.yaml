# ========================================================================
# POPCULTURE — MEDIUM-FIRST WILDCARDS FOR COMFYUI DYNAMIC PROMPTS
#
# COVERS: Popular-culture modes across film, television, music, print, and
# advertising — genre archetypes, performance moments, character design, and
# production formats — without copying specific works.
#
# Theme core components: source medium, genre, era/rendering, subject,
# scene language, and output format; build recognizable types without imitation.
#
# GLOBAL RULE: Read and apply ./prompt.md (MODE: tags)
# THEME EXTENSION — POP CULTURE
# Prefer instantly enjoyable media archetypes, performance moments, genre poses, promotional images,
# fandom artifacts, playful spectacle and era-specific production language without copying a named
# person, character, franchise or composition.
# Example: (masked urban rescuer:1.2), swinging on cable beneath collapsing elevated rail line,
# catching falling passenger mid-air, wide tracking shot.
# Out of scope: direct imitation, celebrity likeness as the concept, logos as the visual hook,
# discourse about fandom or media institutions, generic quality/style-name prompting, and
# multi-panel or sequential-page routes (see Tags Mode note below).
#
# ROUTE USAGE
# combo: Composes compatible components into a coherent, production-ready prompt.
# spotlight: Selects a curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
#
# TAGS MODE NOTE
# Every leaf is a flat, comma-separated tag phrase with optional (term:weight) emphasis; see
# prompt.md's "Prompt language (Tags Mode)" section. The manga/comic page-sequence and film/television
# storyboard content from the prior narrative draft of this file has been collapsed into single
# decisive-moment leaves; only each medium's single-image rendering signature (screentone ink,
# panel-border inking, film color grade, and so on) survives, applied as a style tag.
# ========================================================================

