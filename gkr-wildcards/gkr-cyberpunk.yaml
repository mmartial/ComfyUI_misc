    - adult holding a funeral portrait beside a household terminal displaying the same elderly face, waveform and PARENT VOICE MODEL label, one hand reaching toward the physical power switch

  climate_city_scene:
    - flood barriers surrounding luxury towers while lower apartment streets remain submerged
