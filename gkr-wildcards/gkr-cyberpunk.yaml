    - two people in adjacent playback booths holding identical birthday photographs while both screens show the same cake, room and child from matching camera positions, duplicate capsule serial numbers enlarged between them
    - open family album beside a glowing archive screen, the paper group photograph showing an empty chair while the digital version inserts an unfamiliar smiling figure into that exact space
