    - influencer recording polished luxury content with industrial waste hidden just outside the frame
    - newsroom staff facing an official ALL CLEAR flood report while a mud-soaked reporter places waterlogged evacuation tags, damaged respirators and photographs of submerged homes across the illuminated desk

