# ========================================================================
# CYBERPUNK — VISUAL, SYSTEMS-BASED WILDCARDS FOR COMFYUI
# High technology made visible through labor, bodies, infrastructure,
# inequality, repair, surveillance, climate, and everyday urban life.
# ========================================================================

gkr_cyberpunk:

# ------------------------------------------------------------------------
# VISUAL TREATMENT
# ------------------------------------------------------------------------

  camera:
    - street-level wide view with foreground pedestrians and layered infrastructure
    - medium ensemble frame preserving every person's action and reaction
    - close observational portrait with role-defining tools inside the frame
    - overhead view clarifying queues, checkpoints and restricted routes
    - long-lens view compressing workers, advertisements and distant luxury towers
    - low tracking angle beside moving vehicles and wet road surfaces
    - fixed surveillance-camera view with timestamp and detection boxes
    - documentary handheld view close to practical work
    - symmetrical institutional frame disrupted by one improvised human action
    - cutaway or sectional view showing connected interior systems

  lighting:
    - overcast daylight reflected from concrete, glass and standing water
    - harsh fluorescent work light with uneven failed fixtures
    - warm improvised task lamps inside a dark repair stall
    - sodium-vapor street lighting with restrained colored signage
    - sterile corporate white light behind clean glass partitions
    - emergency-red illumination during a power or transit failure
    - hard coastal sunlight diffused through pollution and salt haze
    - practical vehicle headlights cutting through rain or dust
    - pale screen light secondary to visible room illumination
    - dawn light revealing maintenance wear hidden by the night

  rendering:
    - cinematic concept art, realistic material wear, restrained color and clear spatial storytelling
    - graphic-novel illustration, strong ink hierarchy, limited spot color and readable crowd staging
    - documentary science-fiction photography, natural skin, practical technology and fine film grain
    - industrial design visualization, crisp construction detail, scale references and maintenance access
    - hand-painted retro-future frame, analog displays, atmospheric depth and controlled highlights
    - architectural visualization with lived-in clutter, utilities and human circulation
    - monochrome cyber-noir ink, broad shadows, rain texture and one warning-color accent
    - animated science-fiction key frame, clean linework, subdued cel shading and painted background

# ------------------------------------------------------------------------
# GENRE-SAFE CHARACTER FAMILIES
# ------------------------------------------------------------------------

  corporate_character:
    - compliance inspector photographing unauthorized prosthetic repairs, severe suit, evidence tablet and company badge
    - exhausted office analyst surrounded by transparent productivity displays, lunch untouched beside the keyboard
    - corporate physician presenting several branded implant options across a clean consultation table
    - executive framed by panoramic city glass while physical security staff wait behind
    - biometric courier carrying sealed medical cases through a restricted elevator lobby
    - brand technician replacing public transit signs with corporate access instructions
    - human-resources interviewer seated across from an applicant whose implant license flashes red
    - facilities manager walking through a darkened office floor with a manual override kit

  street_economy_character:
    - cybernetic repairer working beneath improvised lamps, labeled drawers of incompatible replacement parts
    - food vendor cooking beside humming battery stacks, payment terminals from several obsolete networks
    - data-card broker behind a crowded market counter, physical cases cataloged by hand
    - waste sorter separating circuit boards, batteries and synthetic organs with protective tools
    - street tailor adapting a raincoat around mismatched prosthetics, chalk marks visible on the fabric
    - informal transit driver repairing a crowded shared vehicle at the roadside
    - identity-photo operator maintaining old cameras beside a biometric checkpoint
    - secondhand implant dealer testing salvaged components in front of a cautious customer

  infrastructure_character:
    - cooling technician inside a condensation-covered server tunnel, insulated tools and leak markers
    - power-line crew member repairing cables above a flooded street in a tethered harness
    - water worker inspecting filtration membranes beneath a housing block
    - drone mechanic surrounded by numbered damaged units and printed repair histories
    - vertical-farm worker replacing nutrient tubes between tall crop racks
    - transit technician manually opening failed platform doors during rush hour
    - flood-barrier operator clearing salt corrosion from immense hydraulic joints
    - waste-processing engineer tracing a blockage through transparent industrial pipes

  healthcare_character:
    - prosthetic fitter marking joint alignment while a patient practices grip control
    - underground surgeon sterilizing reused implant components in a converted delivery van
    - rehabilitation patient training with an older mechanical hand and physical calibration rig
    - technician repairing obsolete ocular hardware beneath a magnifying lamp
    - mobile-clinic nurse checking several generations of incompatible hearing implants
    - memory therapist arranging labeled physical storage capsules before a session
    - occupational-health worker inspecting exoskeleton pressure injuries on warehouse staff
    - community pharmacist dispensing anti-rejection medication from a locked market stall

  synthetic_character:
    - android applying artificial skin over a repaired forearm before a small mirror
    - several identical service models individualizing clothing in a secondhand shop
    - decommissioned robot carrying personal belongings from a factory gate
    - synthetic care worker helping an elderly resident through a crowded clinic
    - damaged android waiting quietly among human patients, temporary tape sealing one panel
    - machine worker replacing its own unsupported component using a printed manual
    - household intelligence housed in several mismatched appliances arranged around one family table
    - archived personality speaking from an obsolete terminal beside boxes of a deceased owner's belongings

  media_character:
    - investigative journalist comparing printed photographs with corrupted surveillance frames
    - news presenter recording a polished segment while a damaged district remains visible beyond the studio glass
    - street documentarian carrying compact cameras beneath anti-recording signs
    - influencer framing luxury content to hide industrial waste just outside the shot
    - public-records clerk copying files before an automated deletion timer expires
    - multilingual interpreter guiding travelers through contradictory border-terminal screens
    - independent radio operator broadcasting from a rooftop mesh-network station
    - propaganda designer reviewing several revised versions of the same public face

  community_character:
    - tenant organizer carrying printed lockout notices and a portable door override
    - right-to-repair activist opening a corporate prosthetic at a shared workbench
    - volunteer distributing charged batteries during a neighborhood grid outage
    - community-network technician installing an antenna between apartment roofs
    - public defender comparing two conflicting biometric identities with a detained traveler
    - climate-shelter coordinator directing families toward available cooling bunks
    - retired augmentation recipient teaching younger residents to maintain unsupported hardware
    - neighborhood teacher covering classroom sensors while students assemble a local air-quality monitor

  security_character:
    - checkpoint officer comparing a traveler against two mismatched identity screens
    - drone-unit operator watching detection boxes multiply across an ordinary crowd
    - private security guard standing between premium and public transit platforms
    - predictive-policing analyst surrounded by maps whose highlighted zones match neglected infrastructure
    - corporate extraction team carrying sealed equipment through an apartment corridor
    - exhausted patrol medic treating a protester behind a transparent riot barrier
    - internal investigator photographing evidence inside a pristine executive office
    - former military augment user working unarmed night security with outdated licensed hardware

  relationship:
    - parent and adult child maintaining incompatible generations of implants
    - worker and supervisor silently disagreeing beneath a performance display
    - synthetic caregiver and elderly resident moving through a crowded institution together
    - investigator and reluctant witness comparing physical evidence
    - repairer and customer negotiating around a locked unsupported device
    - longtime neighbors coordinating during an infrastructure failure
    - corporate employee quietly assisting a street-level organizer
    - migrant family and interpreter navigating a biometric checkpoint

# ------------------------------------------------------------------------
# FUNCTIONAL ENVIRONMENTS
# ------------------------------------------------------------------------

  housing_environment:
    - stacked capsule apartments, shared exterior walkways, laundry, exposed utilities and failed elevator shaft
    - corporate dormitory, identical rooms, shift schedules projected beside secured exits
    - improvised rooftop additions connected by patched power and water lines
    - luxury residential level physically separated from service floors by guarded glass doors
    - aging apartment corridor where residents cover hallway sensors with household objects
    - automated eviction scene, belongings in the corridor, door display reading LEASE TERMINATED

  transit_environment:
    - elevated metro interchange at rush hour, biometric gates, one failed lane opened manually by technicians
    - ferry terminal processing climate migrants through layered identity checkpoints
    - informal minibus depot, battery swaps, hand-painted routes and crowded repair bays
    - autonomous taxi queue stalled behind a software failure while human drivers negotiate rides nearby
    - freight rail terminal dividing automated cargo tracks from aging worker housing
    - vertical cable-transit station connecting dense hillside neighborhoods

  healthcare_environment:
    - public implant clinic, long waiting area, branded treatment prices and community repair notices
    - black-market surgery stall behind a legitimate pharmacy, reused equipment visibly sterilized
    - rehabilitation gym with mechanical supports, calibration targets and mixed-generation prosthetics
    - corporate hospital lobby divided into subscription tiers by physical barriers
    - mobile clinic operating from a converted delivery vehicle during a power outage
    - memory-treatment room, physical storage library, consent forms and isolated playback chair

  industry_environment:
    - automated warehouse, workers following projected floor arrows beneath performance timers
    - server cooling plant, condensation, immense fans, maintenance walkways and emergency drains
    - electronics recycling district, sorted components, protective clothing and toxic runoff controls
    - vertical farm, stacked crops, nutrient pipes, pollination drones and human inspection platforms
    - coastal desalination plant protected by temporary flood walls and corroded machinery
    - implant assembly factory with clean production floor and crowded shift-change exit

  market_environment:
    - informal repair market under transit tracks, parts labeled across several incompatible standards
    - dense night food market powered by shared batteries and practical task lights
    - secondhand synthetic-body shop, replacement shells hanging beside ordinary clothing
    - multilingual port bazaar, logistics workers, sailors, data brokers and customs patrols
    - neighborhood exchange during a network outage, handwritten prices and physical tokens
    - corporate retail arcade displaying pristine upgrades above residents repairing older devices

  climate_environment:
    - flooded lower streets beneath dry luxury skybridges, boats moving between apartment entrances
    - public cooling shelter surrounded by heat-distorted housing blocks and water queues
    - coastal megacity flood gates closing while maintenance crews remain on the exposed side
    - drought suburb converted into vertical agriculture and battery storage
    - arctic extraction settlement, insulated machinery, seasonal darkness and worker dormitories
    - storm evacuation center processing residents, pets, prosthetic chargers and paper records

  regional_environment:
    - Southeast Asian coastal megacity, flood-adapted markets, elevated walkways and ferry logistics
    - South Asian biometric rail terminal beside an informal electronics repair district
    - East African mobile-finance district powered by rooftop solar and shared battery kiosks
    - Latin American hillside housing connected by cable transit and community mesh antennas
    - Middle Eastern heat-management city with shaded pedestrian corridors and district cooling pipes
    - East Asian logistics port, automated freight, worker housing and multilingual control systems
    - European automated border terminal built into aging rail infrastructure
    - North American corporate municipality surrounding a private data center and cooling reservoir

# ------------------------------------------------------------------------
# VISIBLE TECHNOLOGY AND DESIGN SUBJECTS
# ------------------------------------------------------------------------

  augmentation_subject:
    - medical prosthetic with replaceable joints, physical calibration marks and independent controls
    - employer-issued lifting exoskeleton, shift counter, pressure wear and remote lock indicator
    - cosmetic facial implant with visible maintenance port and customizable outer shell
    - obsolete ocular system, scratched lens, unsupported connector and improvised adapter
    - neural interface with consent switch, recording indicator and removable storage capsule
    - military limb converted for civilian work, weapon mounts removed and tool fittings added
    - community-built hearing device assembled from open components and printed housing
    - subscription-controlled arm locked at the elbow beneath a red LICENSE EXPIRED display

  interface_prop:
    - dispatch wrist terminal showing delivery timer, route penalty and current worker ranking
    - biometric identity card displaying two conflicting names and photographs
    - printed blind-spot map marked against a city surveillance plan
    - physical memory capsule labeled with date, owner and usage permissions
    - corporate prosthetic service tool that refuses an unlicensed component
    - community mesh router assembled from reused consumer electronics
    - eviction drone carrying replacement locks, property tags and inventory scanner
    - portable air-quality monitor built by students from mismatched sensors

  vehicle_subject:
    - shared electric minibus with hand-painted route, battery access panels and repair history
    - algorithm-dispatched courier bicycle carrying several competing company boxes
    - corporate autonomous limousine with sealed passenger cell and external security sensors
    - flood-rescue skiff carrying prosthetic chargers, medical storage and folding shelter
    - port cargo tractor modified by workers with manual controls and shade canopy
    - mobile implant clinic converted from an aging delivery vehicle
    - cable-transit maintenance carriage with winch, tools and emergency evacuation seats
    - informal neighborhood power cart transporting charged batteries during an outage

# ------------------------------------------------------------------------
# AUTHORED VISUAL SCENES
# ------------------------------------------------------------------------

  corporate_power_scene:
    - executive boardroom overlooking workers leaving a darkened factory after the company logo remains illuminated
    - corporate security replacing municipal signs with branded access instructions as residents photograph the change
    - public plaza divided into premium and restricted lanes by transparent barriers and different floor materials
    - employees scanning implant licenses before entering elevators while one worker's arm displays an error
    - branded clinic presenting treatment prices beside a visibly overcrowded public waiting area
    - office floor emptying during layoffs while automated desks continue displaying productivity targets

  platform_labor_scene:
    - bicycle couriers waiting beneath a wall-sized dispatch screen, timers counting down, security watching from glass booth
    - warehouse workers following projected arrows while a colleague repairs a failed exoskeleton beside the active line
    - drivers sleeping inside a charging depot, route rankings projected above parked vehicles
    - cleaning crew watched by performance displays while polished offices remain empty
    - food-delivery riders sheltering from toxic rain beneath an advertisement for private weather control
    - content moderators leaving a windowless shift room while cheerful media loops continue across the walls

  surveillance_scene:
    - pedestrians crossing beneath layered biometric gates, one face producing several contradictory detection boxes
    - police drones projecting identification rectangles over a peaceful market crowd
    - protesters hiding faces with reflective umbrellas and patterned makeup beneath coordinated cameras
    - security operator monitoring hundreds of street feeds as one camera shows the operator from behind
    - traveler detained because adjacent identity screens display different ages and names
    - apartment residents covering corridor sensors while carrying supplies to an unseen neighbor

  augmentation_scene:
    - mechanic seated in a cramped stall, cybernetic arm locked, LICENSE EXPIRED warning beside incompatible parts
    - family comparing three generations of hearing implants around a kitchen table covered with adapters
    - warehouse employee removing an employer exoskeleton, deep pressure marks visible beneath the harness
    - patient practicing grip control while a fitter adjusts mechanical finger alignment
    - underground clinic replacing a proprietary connector with a hand-machined open adapter
    - cosmetic modification studio displaying identity choices beside clinical maintenance instructions

  synthetic_person_scene:
    - identical service androids choosing distinct secondhand clothing after a factory decommissioning
    - synthetic care worker helping an elderly resident through a clinic that places robots in a separate queue
    - machine worker repairing itself from an obsolete printed manual beside a pile of rejected components
    - android family portrait assembled from bodies of different manufacturers and repair histories
    - archived personality terminal included among household belongings during an apartment move
    - decommissioned robots waiting outside a factory gate with boxes, tools and personal decorations

  community_scene:
    - neighbors installing mesh antennas between rooftops during a citywide communications failure
    - repair collective opening locked prosthetics across a shared workbench while owners observe
    - volunteers distributing charged batteries through a dark apartment courtyard
    - tenants physically barricading an automated property drone outside their building entrance
    - community clinic sharing calibration tools across improvised treatment stations
    - residents painting a new pedestrian map over a predictive-policing district display

  memory_identity_scene:
    - person comparing conflicting childhood photographs while a memory capsule reader displays both as authenticated
    - two strangers recognizing the same recorded birthday memory at adjacent playback booths
    - family archive containing an artificial replacement portrait where one relative should appear
    - store selling packaged vacation memories through transparent demonstration cubicles
    - memory technician arranging physical capsules whose owner labels have been mechanically removed
    - adult child confronting a household terminal that speaks in a deceased parent's reconstructed voice

  climate_city_scene:
    - flood barriers surrounding luxury towers while lower apartment streets remain submerged
    - cooling shelter queue beneath heat-distorted buildings and an animated cold-drink advertisement
    - climate migrants arriving through a biometric ferry terminal carrying chargers and paper records
    - vertical farms operating beside abandoned drought-stricken suburbs
    - maintenance crews clearing salt corrosion from coastal infrastructure before another storm
    - water queue forming beneath a corporate fountain accessible only through a guarded lobby

  media_scene:
    - giant advertisement promising clean air above workers wearing respirators at street level
    - news presenter composited over a damaged district still visible through studio glass
    - competing augmented messages occupying the same protest while physical signs remain consistent
    - public screens replacing an arrested person's face as bystanders compare printed photographs
    - influencer recording polished luxury content with industrial waste hidden just outside the frame
    - newsroom staff watching an official feed while a reporter holds contradictory physical evidence

  cyber_noir_scene:
    - investigator comparing rain-damaged receipts with corrupted surveillance stills in a nearly empty transit café
    - witness interviewed behind a repair shop while security reflections reveal someone watching outside
    - detective tracing camera blind spots on a printed map beneath flickering practical street lights
    - missing-person photograph appearing inside advertisements across several unrelated districts
    - investigator entering a sealed office where every device has been removed but warm cable impressions remain
    - public defender following an identity error through clinics, checkpoints and an abandoned apartment

