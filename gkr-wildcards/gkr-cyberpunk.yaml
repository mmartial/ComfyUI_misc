# ========================================================================
# CYBERPUNK — VISUAL, SYSTEMS-BASED WILDCARDS FOR COMFYUI (TAGS MODE)
#
# COVERS: Lives shaped by unequal technology — augmented bodies, precarious labor,
# surveillance, corporate power, climate stress, resistance, synthetic people,
# memory/identity, media and urban survival. High technology made visible through
# labor, bodies, infrastructure, inequality, repair, surveillance, climate and
# everyday urban life.
#
# Theme core components: visual treatment, character/labor, environment,
# visible technology, power system, and narrative action; show themes physically.
#
# GLOBAL RULE: Read and apply ./prompt.md (MODE: tags)
# THEME EXTENSION — CYBERPUNK
# Prefer augmented characters, street archetypes, infiltration, chases, confrontations, strange
# technology, dense cities and stylish action alongside grounded daily life. A role label such as
# cyber samurai, netrunner or techno-mage must be supported by visible hardware, clothing and action.
# CYBERPUNK TWO-SIGNAL TEST: Every authored scene, combo, spotlight or random result must show at
# least two compatible visual signals of cyberpunk drawn from different categories: bodily augmentation
# or synthetic anatomy; hardwired human-machine interface; autonomous sensing or surveillance;
# biometric access or algorithmic control; layered data/power infrastructure; unequal access to
# advanced technology. The signals must reinforce the focal subject, action or environment rather than
# appear as unrelated decoration. The word "cyberpunk," neon lighting, a futuristic skyline or one
# ordinary screen is insufficient. Design the signals into authored concepts; use general signature
# pools only for modular random construction. A design sheet may focus on one signal when that
# technology is itself the subject.
# Example: (cable-linked deck user:1.1), crouched behind market stall, drones closing overhead.
# Out of scope: bureaucracy as the dominant attraction, abstract political analysis, generic neon
# skylines without a focal idea, social systems described without visible consequences.
#
# ROUTE USAGE
# combo: Composes compatible components into a coherent, production-ready tag string.
# spotlight: Selects a curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
#
# TAGS-MODE TRANSFORMATION RULE
# Every leaf is a flat, comma-separated tag-phrase list — subject + visible pose/action +
# concrete setting/props — weighted with (term:weight) on only the 1-3 elements that matter
# most (typical 0.8-1.2, reserve 1.3+ and sub-0.8 for standout items). No negative prompts.
# No sequential/panel/page routes; single image only. A downstream LLM may clarify wording
# but must not invent the visual representation.
# ========================================================================

