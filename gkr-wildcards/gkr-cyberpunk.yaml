    - soaked ferry passengers carrying suitcases, prosthetic chargers and paper records through biometric gates, floodwater and an evacuation vessel visible through the terminal glass
    - vertical farms operating beside abandoned drought-stricken suburbs
    - tethered maintenance crews scraping white salt corrosion from immense floodgate joints while dark storm clouds, raised warning flags and rough water fill the horizon
    - water queue forming beneath a corporate fountain accessible only through a guarded lobby

  media_scene:
