# ------------------------------------------------------------------------
# MANGA: DEMOGRAPHICS, PAGE GRAMMAR, AND SCENES
# ------------------------------------------------------------------------

  manga_rendering:
    - bold black contour ink, coarse screentone shadows, tapered speed lines
    - delicate flowing linework, floral framing, luminous white negative space
    - realistic anatomy, dense urban crosshatching, restrained facial acting
    - clean everyday backgrounds, subtle tones, quiet observational drawing
    - intricate mechanical linework, debris fields, extreme but readable foreshortening
    - obsessive fine hatching, warped perspective, large areas of solid black
    - rough brush ink, confrontational low angles, hand-drawn sound effects
    - woodblock-influenced landscapes, dry-brush motion, controlled sword arcs
    - scratchy autobiographical linework, collage textures, handwritten narration
    - playful simplified forms, clean four-panel timing, expressive reaction inserts

  manga_page_grammar:
    - chapter-opening splash page followed by narrow reaction panels and one silent final panel
    - clear right-to-left action flow, establishing panel, approach, impact and consequence
    - repeated fixed composition where one background detail changes in every panel
    - large emotional close-up balanced by speech-balloon-safe negative space
    - dense environment spread with small inset panels tracking individual discoveries
    - quiet six-panel grid using hands, objects and eyelines instead of exposition
    - irregular fractured gutters reflecting unstable memory without obscuring reading order
    - four equal horizontal panels with setup, reinforcement, reversal and silent payoff
    - borderless dream sequence transitioning into rigid panels when reality returns
    - full-page mechanical or architectural reveal preceded by small scale-reference panels

  manga_shonen_scene:
    - rivals facing each other before a tournament's final exchange, matching accumulated wounds, broken weapons and spectators holding scorecards from earlier rounds
    - adventure team crossing a collapsed bridge, scout firing a rope, shield-bearer anchoring it, healer supporting an injured member and mechanic tightening the pulley
    - reckless protagonist repeating a failed strike against scarred training posts while a rival erases one plan and sketches a new footwork diagram nearby
    - wounded mentor placing the evacuation map and leader's armband into the youngest member's hands as civilians crowd the marked exit
    - former enemy lifting a fallen beam beside the heroes to free trapped civilians, both sides keeping damaged weapons lowered but within reach
    - training chapter centered on repetition, injury prevention and incremental visible improvement

  manga_shojo_scene:
    - student opening a box containing every small gift given to a longtime friend across several seasons, matching dated photographs and pressed flowers spread around a handwritten confession
    - formal dance where partners repeatedly change, visual motifs tracking the person each character truly watches
    - heroine at a station platform gripping an art-school acceptance letter while a partner holds two unused hometown tickets, affectionate hands touching as they face opposite trains
    - two friends carrying grocery bags together after an argument, one offering the other's favorite drink while a torn photograph remains taped inside a phone case
    - historical correspondence romance shown through letters, seasonal plants and changing handwriting
    - performer stepping onstage after a rival silently repairs a damaged costume

  manga_seinen_scene:
    - detective covering a municipal-office floor with contracts, invoices and ownership charts, the same shell-company seal circled across unrelated public projects, calculator and evidence photographs beside the files
    - military veteran crouched behind an office cubicle with shoulders rigid and hand reaching toward an absent holster while two coworkers argue harmlessly beside a jammed printer
    - engineer facing an autonomous security machine that shields an injured trespasser from armed officers, red violation warnings across the control screen, emergency medical kit open at the machine's feet
    - aging athlete seated beneath championship photographs, old trophy beside medical scans and a newspaper image of the former teammate now walking with crutches
    - investigative journalist at a cluttered newsroom desk, unpublished article proofs beside photographs of a clinic worker and a family entering a shelter, every source name blacked out in marker, one finger stopped above an illuminated upload key, other hand covering the photographs
    - two criminals seated opposite each other in a busy family restaurant booth, sealed cash envelope and burner phone between untouched meals, one hand below the table gripping a hidden pistol while families eat in adjacent booths

  manga_josei_scene:
    - coworkers in their thirties after a promotion, one wearing a new supervisor badge while both hold matching old friendship photographs across a formal office desk
    - office worker at home between a pressed business suit and a workbench covered with finished handmade ceramics, resignation envelope beside kiln invoices and an exhibition invitation
    - divorced parent dating again while maintaining boundaries around family life
    - adult siblings on opposite sides of an aging relative's kitchen table, one holding home-care schedules, the other a residential-care brochure, untouched tea and medication organizer between them
    - former university friends at their annual restaurant table, different uniforms, wedding rings, childcare bags and work badges surrounding the same old campus photograph
    - costume designer pinning their own name and junior assistants' names onto a production credit board while a deadline clock glows above piles of unfinished costumes

  manga_horror_scene:
    - apartment floor plan changing subtly between panels while the resident marks every discrepancy
    - town residents smiling identically whenever the protagonist mentions a missing family
    - medical illustration gradually replacing the reader's view of a living character
    - reflected crowd containing one figure whose face occupies progressively more of each panel
    - diary writing new entries in the protagonist's handwriting during blank gutters
    - seaside staircase continuing below the water while footprints emerge upward

  manga_sports_scene:
    - final rally decomposed into foot placement, breath, teammate positioning and one decisive contact
    - injured captain contributing through observation and strategy from the sideline
    - novice losing badly but recognizing the exact skill needed for the next season
    - rivals reviewing the same match afterward and interpreting its turning point differently
    - team practice during a heat wave revealing leadership through small acts of care
    - student athlete asleep over textbooks in a laundromat work uniform, taped knee elevated on a sports bag, training schedule and late-shift timecard beside an alarm clock

  manga_yonkoma_scene:
    - office worker misinterpreting an automated reminder as increasingly personal criticism
    - fantasy hero's legendary weapon repeatedly used for mundane household repairs
    - cat strategically relocating objects while humans invent supernatural explanations
    - student preparing the perfect confession only to deliver it to the wrong identical locker
    - ghost levitating a chair and stretching a shadow across the ceiling while the unfazed resident points toward cracked pipes with a wrench and maintenance checklist
    - four-panel sequence: robot studies a sarcasm phrasebook, practices a smug expression, repeats the phrase at a funeral, mourners turn in shock while the robot gives a cheerful thumbs-up

  manga_historical_scene:
    - merchant household around a ledger table, new regime's seal stamped across inventory lists, debt notes and marriage contract while soldiers replace flags outside the shop
    - traveling artist documenting communities before a new road transforms the region
    - sword school divided over whether tradition permits adaptation to unfamiliar weapons
    - court attendant using poetry and gift etiquette to prevent a factional confrontation
    - rural midwife crossing a winter pass to reach an isolated settlement
    - postwar family rebuilding a neighborhood print shop from salvaged equipment

  manga_experimental_scene:
