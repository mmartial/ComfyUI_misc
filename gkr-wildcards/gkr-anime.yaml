# ========================================================================
# ANIME — TAGS-MODE WILDCARDS FOR COMFYUI DYNAMIC PROMPTS
#
# GLOBAL RULE: Read and apply ./prompt.md (MODE: tags)
#
# THEME EXTENSION — ANIME
# Flat, comma-separated Danbooru/booru-style tag phrases with light
# (term:weight) emphasis on 1-3 items per leaf. No full sentences, no
# negative_prompt category (handled elsewhere in the workflow).
#
# SCOPE: character/creature/mecha/vehicle design pools, personality
# archetypes (tsundere/kuudere/yandere/dandere/chuunibyou/megane), gyaru
# archetype, genre scenes (action/romance/slice-of-life/comedy/sports/
# mystery/horror/mecha/scifi/historical/music/culinary/adult-drama/
# childrens), anime "traditions" (isekai, villainess reincarnation,
# magical girl/team, battle progression, super/real robot, sentai, cgdct,
# yokai folklore, idol industry, vtuber, harem, delinquent, military/
# political, kaiju, space opera, cyberpunk, post-apocalyptic, racing,
# martial arts, iyashikei, ecological fantasy), production formats
# (ensemble, key visual, poster, character/creature/mecha/vehicle sheets),
# and a large hand-authored spotlight library carried forward from the
# original tags-era file (curated fantasy/sci-fi character and background
# pools, action/romantic/dramatic/slice-of-life scene pools).
#
# MANGA: page/panel grammar (splash pages, panel sequences, gutters) has
# no flat-tag equivalent per prompt.md Tags Mode and is intentionally not
# authored here. Only manga's single-image rendering signature (ink
# linework, screentone, crosshatch shading, panel-border framing as an
# aesthetic) survives, as the manga_style pool — a style modifier for
# ordinary single-image leaves, never a route into sequential panels.
# ========================================================================

