    - siblings mapping sounds inside an inherited house whose rooms do not match the exterior walls
    - detective interviewing an apparently helpful witness while reflections reveal rehearsed body language
    - journalist tracing anonymous messages through discontinued vending machines across the city

  anime_horror_scene:
