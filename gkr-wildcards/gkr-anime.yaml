# ========================================================================
# ANIME & MANGA — MEDIUM-FIRST WILDCARDS FOR COMFYUI DYNAMIC PROMPTS
#
# COVERS: Anime and manga as visual storytelling traditions—their eras, genres,
# audiences, character language, cinematic scenes, and production formats.
#
# Major-version redesign: coherent genre, demographic, and scene routes.
#
# Theme core components: era/rendering, genre/demographic, character, setting,
# cinematic grammar, and output format; align them around one readable scene.
#
# ROUTE USAGE
# combo: Composes compatible components into a coherent, production-ready prompt.
# spotlight: Selects a curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
#
# DIFFUSION-READY TRANSFORMATION RULE
# Every generated leaf must already describe an image without requiring interpretation:
# subject + visible pose/action + concrete setting/props + composition/light when useful.
# Do not emit decisions, motives, backstory, relationships, themes, causality or time-based
# change unless they are replaced by observable evidence inside one frame. Use gestures,
# eyelines, documents, screens, damage, clothing, objects and spatial contrast. If a concept
# needs multiple moments, specify a storyboard, comic panels or a split-state design sheet.
# A downstream LLM may clarify wording but must not invent the visual representation.
#
# NON-LEAF / COMPOSITE RULE
# A router-only item must contain wildcard references only. A composite item may add literal
# text, but every added phrase must pass the same diffusion-ready rule as a leaf. Referenced
# categories must be visually compatible in every possible expansion; do not combine broad
# pools when any pairing can contradict subject, setting, era, equipment, scale or format.
# Test composites by separating literal text from references, scanning the literal text for
# abstractions, resolving the full route graph, and reviewing every referenced pool pairing.
# ========================================================================

