    - traditional hot-spring lane after snowfall, wooden inns, steam and warm window light
    - post-apocalyptic shopping arcade converted into gardens, workshops and rainwater storage
    - festival riverbank with lantern reflections, temporary stages and an approaching storm front
    - cramped student apartment filled with laundry, instant-food containers and model-kit tools
    - underground supernatural station whose signs point toward districts absent from the city map
    - airship engine room with brass access panels, canvas insulation and an open storm-lit maintenance hatch
    - cosmic frontier where a small roadside shelter stands beneath immense ringed planets

  expanded_anime_scene:
