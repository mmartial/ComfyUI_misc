# ------------------------------------------------------------------------
# MANGA: DEMOGRAPHICS, PAGE GRAMMAR, AND SCENES
# ------------------------------------------------------------------------

  manga_rendering:
    - bold black contour ink, coarse screentone shadows, tapered speed lines
    - delicate flowing linework, floral framing, luminous white negative space
    - realistic anatomy, dense urban crosshatching, restrained facial acting
    - clean everyday backgrounds, subtle tones, quiet observational drawing
    - intricate mechanical linework, debris fields, extreme but readable foreshortening
    - obsessive fine hatching, warped perspective, large areas of solid black
    - rough brush ink, confrontational low angles, hand-drawn sound effects
    - woodblock-influenced landscapes, dry-brush motion, controlled sword arcs
    - scratchy autobiographical linework, collage textures, handwritten narration
    - playful simplified forms, clean four-panel timing, expressive reaction inserts

  manga_page_grammar:
    - chapter-opening splash page followed by narrow reaction panels and one silent final panel
    - clear right-to-left action flow, establishing panel, approach, impact and consequence
    - repeated fixed composition where one background detail changes in every panel
    - large emotional close-up balanced by speech-balloon-safe negative space
    - dense environment spread with small inset panels tracking individual discoveries
    - quiet six-panel grid using hands, objects and eyelines instead of exposition
    - irregular fractured gutters reflecting unstable memory without obscuring reading order
    - four equal horizontal panels with setup, reinforcement, reversal and silent payoff
    - borderless dream sequence transitioning into rigid panels when reality returns
    - full-page mechanical or architectural reveal preceded by small scale-reference panels

  manga_shonen_scene:
    - rivals confronting each other before a tournament's final exchange, damage and spectators recording the history of the fight
    - adventure team solving a problem by combining specialized skills rather than escalating individual power
    - reckless protagonist learning a technique through failure while a rival quietly changes strategy
    - mentor entrusting leadership to the youngest member during an evacuation
    - former enemy joining a rescue effort while neither side has time to resolve distrust
    - training chapter centered on repetition, injury prevention and incremental visible improvement

  manga_shojo_scene:
    - student realizing a longtime friend's feelings through objects saved across several seasons
    - formal dance where partners repeatedly change, visual motifs tracking the person each character truly watches
    - heroine choosing a personal ambition over an expected relationship, affection remaining without easy resolution
    - two friends repairing trust after romantic jealousy through an ordinary shared errand
    - historical correspondence romance shown through letters, seasonal plants and changing handwriting
    - performer stepping onstage after a rival silently repairs a damaged costume

  manga_seinen_scene:
    - detective discovering a financial crime hidden inside routine municipal contracts
    - veteran returning to civilian work and misreading ordinary workplace conflict as tactical threat
    - engineer investigating why an autonomous system makes compassionate but illegal decisions
    - aging athlete confronting evidence that a celebrated victory harmed a teammate's career
    - journalist choosing whether to publish a true story that exposes vulnerable sources
    - criminal negotiation unfolding across a family restaurant while unrelated customers continue eating

  manga_josei_scene:
    - coworkers in their thirties negotiating friendship after one becomes the other's supervisor
    - woman deciding whether to leave a stable career for a craft she has practiced privately for years
    - divorced parent dating again while maintaining boundaries around family life
    - adult siblings disagreeing over care for an aging relative without a simple villain
    - former university friends meeting annually as careers, relationships and expectations diverge
    - costume designer balancing artistic credit, exploitative deadlines and loyalty to junior staff

  manga_horror_scene:
    - apartment floor plan changing subtly between panels while the resident marks every discrepancy
    - town residents smiling identically whenever the protagonist mentions a missing family
    - medical illustration gradually replacing the reader's view of a living character
    - reflected crowd containing one figure whose face occupies progressively more of each panel
    - diary writing new entries in the protagonist's handwriting during blank gutters
    - seaside staircase continuing below the water while footprints emerge upward

  manga_sports_scene:
    - final rally decomposed into foot placement, breath, teammate positioning and one decisive contact
    - injured captain contributing through observation and strategy from the sideline
    - novice losing badly but recognizing the exact skill needed for the next season
    - rivals reviewing the same match afterward and interpreting its turning point differently
    - team practice during a heat wave revealing leadership through small acts of care
    - athlete balancing school, work and recovery rather than relying on effortless talent

  manga_yonkoma_scene:
    - office worker misinterpreting an automated reminder as increasingly personal criticism
    - fantasy hero's legendary weapon repeatedly used for mundane household repairs
    - cat strategically relocating objects while humans invent supernatural explanations
    - student preparing the perfect confession only to deliver it to the wrong identical locker
    - ghost attempting to frighten a resident who keeps offering practical maintenance advice
    - robot learning sarcasm and deploying it at the single worst possible moment

  manga_historical_scene:
    - merchant household navigating a political change through inventory, debts and marriage agreements
    - traveling artist documenting communities before a new road transforms the region
    - sword school divided over whether tradition permits adaptation to unfamiliar weapons
    - court attendant using poetry and gift etiquette to prevent a factional confrontation
    - rural midwife crossing a winter pass to reach an isolated settlement
    - postwar family rebuilding a neighborhood print shop from salvaged equipment

  manga_experimental_scene:
    - autobiographical memory redrawn in several incompatible styles as the narrator questions its accuracy
    - city commute represented as architectural diagrams gradually invaded by human gestures
    - conversation shown only through objects moved around a shared table
    - dream narrative where panel borders become streets and characters climb between pages
    - silent chapter following a discarded object through many unrelated owners
    - performer hearing music visualized as changes in ink density rather than literal notes

  manga_combo:
    - "shonen manga chapter: __gkr_anime/manga_shonen_scene__, __gkr_anime/manga_page_grammar__, __gkr_anime/manga_rendering__, coherent sequential storytelling"
    - "shojo manga chapter: __gkr_anime/manga_shojo_scene__, __gkr_anime/manga_page_grammar__, __gkr_anime/manga_rendering__, emotional motifs and readable panel rhythm"
