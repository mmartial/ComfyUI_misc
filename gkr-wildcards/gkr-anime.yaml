# ========================================================================
# ANIME & MANGA — MEDIUM-FIRST WILDCARDS FOR COMFYUI DYNAMIC PROMPTS
#
# COVERS: Anime and manga as visual storytelling traditions—their eras, genres,
# audiences, character language, cinematic scenes, and production formats.
#
# Major-version redesign: coherent genre, demographic, and scene routes.
#
# Theme core components: era/rendering, genre/demographic, character, setting,
# cinematic grammar, and output format; align them around one readable scene.
#
# ROUTE USAGE
# combo: Composes compatible components into a coherent, production-ready prompt.
# spotlight: Selects a curated, high-specificity concept; preserve its internal logic.
# random: Selects one complete route for breadth; avoid stacking random routes.
# ========================================================================

gkr_anime:

# ------------------------------------------------------------------------
# ANIME: ERAS, RENDERING, AND CINEMATIC GRAMMAR
# ------------------------------------------------------------------------

  anime_era_style:
    - 1960s limited television animation, simplified shapes, economical poses, flat painted backgrounds
    - 1970s theatrical science-fiction animation, hand-painted cels, dramatic shadows, analog optical effects
    - 1980s high-detail cel animation, intricate mechanical drawing, airbrushed light, visible film grain
    - 1990s television cel animation, muted pigments, painted backgrounds, restrained digital compositing
    - early-2000s digital anime, clean linework, selective gradients, softly composited effects
    - modern cinematic anime, natural light, subtle character acting, richly observed environments
    - contemporary television anime, crisp contours, layered cel shading, efficient readable staging
    - experimental mixed-media animation, charcoal, collage, paint and photographed textures
    - ink-wash historical animation, expressive brush edges, parchment-toned negative space
    - gentle children's animation, rounded forms, warm colors, tactile hand-painted backgrounds

  anime_camera:
    - wide establishing frame with characters small inside a carefully observed environment
    - medium ensemble frame allowing every reaction to remain readable
    - low tracking view following running feet and changing terrain
    - still close-up focused on a small shift in eyes, mouth, or hands
    - overhead composition clarifying movement across the entire location
    - long-lens view compressing crowd, weather, and distant architecture
    - subjective point of view with foreground hands or objects anchoring the scene
    - lateral composition staged like a continuous animated cut
    - dramatic low angle reserved for one decisive emotional turn
    - quiet locked frame with action entering and leaving naturally

  anime_environment:
    - coastal commuter town, local train crossing, seawall, narrow hillside streets
    - covered shopping arcade, family businesses, bicycles and afternoon foot traffic
    - rural mountain village, terraced fields, utility wires, weathered community hall
    - compact city apartment, low table, laundry balcony, neighboring windows close by
    - public high school, shoe lockers, club rooms, gymnasium and sunlit corridors
    - university campus, crowded cafeteria, research rooms and bicycle parking
    - corporate office floor, fluorescent light, meeting booths, vending-machine corner
    - neighborhood family restaurant, window booths, drink bar and late-evening regulars
    - industrial harbor, container cranes, warehouses, ferries and cold sea wind
    - traditional hot-spring town, steep lanes, wooden inns, steam crossing lantern light
    - postwar neighborhood, small wooden homes, tram tracks and local market stalls
    - convenience store after midnight, bright shelves against an empty dark street
    - vast mecha maintenance hangar, sectional scaffolding, coolant pipes and tiny technicians
    - historical castle town, workshops, canals, checkpoints and tiled roofs
    - otherworldly frontier, ruined roads crossing immense unfamiliar ecosystems

# ------------------------------------------------------------------------
# ANIME GENRE SCENES
# ------------------------------------------------------------------------

  anime_action_scene:
    - young team confronting a longtime rival at a ruined tournament ground, each member protecting a different route of escape
    - veteran fighter teaching a reckless student through one restrained exchange rather than a display of power
    - two rivals pausing mid-battle when civilians enter the danger zone, conflict shifting into an uneasy rescue partnership
    - courier pursued across rooftops, laundry lines and crowded balconies changing the path every few seconds
    - swordswoman defending a narrow bridge in heavy rain, footwork and terrain more important than visual effects
    - exhausted hero standing again after the apparent final attack, teammates' reactions carrying the emotional escalation
    - coordinated team assault on a colossal creature, each role and failure visible within one clear spatial plan
    - delinquent protecting a younger student at a school gate, confrontation conveyed through posture and surrounding witnesses

  anime_romance_scene:
    - shy confession beside a railway crossing, passing train separating the pair before their reactions are revealed
    - adult former classmates meeting by chance in a nearly empty family restaurant, polite conversation concealing unresolved history
    - two coworkers missing the last train and walking home through quiet streets, conversation gradually becoming personal
    - long-distance couple sharing the same meteor shower from different cities, parallel compositions joined by matching gestures
    - reserved student repairing an umbrella for someone they pretend not to notice, small actions observed across several quiet cuts
    - widowed shopkeeper receiving a familiar seasonal order in the handwriting of a deceased spouse
    - university musicians practicing after hours, mutual affection emerging through timing and attentive listening
    - elderly couple revisiting a coastal station where they once separated, present and memory sharing the same frame

  anime_slice_of_life_scene:
    - friends sharing convenience-store food after missing the last train, jokes giving way to one honest admission
    - family preparing dinner in a cramped kitchen, several generations moving around one another through practiced routines
    - student club restoring an abandoned room, discarded objects revealing the school's forgotten history
    - office worker carrying groceries home in summer rain, stopping to help a neighbor secure laundry in the wind
    - children exploring drainage paths after a storm, turning ordinary infrastructure into an afternoon expedition
    - rural residents reopening a shuttered local shop, sweeping dust while older customers tell conflicting stories
    - university roommates dividing chores after an argument, reconciliation expressed through quietly completed tasks
    - train conductor beginning the first winter service before dawn, checking platforms known by memory

  anime_comedy_scene:
    - carefully planned school announcement collapsing through a chain of mundane interruptions, ensemble reactions held in one wide frame
    - overconfident amateur cook hiding a ruined dish while increasingly suspicious guests arrive early
    - supernatural roommate attempting to follow apartment rules while invisible habits betray every effort
    - four-panel-style misunderstanding escalating because each character interprets the same ordinary object differently
    - student council staging a solemn ceremony while malfunctioning equipment undermines every formal gesture
    - fantasy adventurers negotiating restaurant expenses after defeating a monster, heroic poses replaced by itemized receipts
    - timid employee mistaken for a legendary expert and repeatedly succeeding through coincidence
    - neighborhood pets silently coordinating around humans who misunderstand the entire situation

  anime_sports_scene:
    - volleyball team executing a rehearsed final play, every member contributing before the full-court result
    - exhausted distance runner choosing whether to help an injured rival as the leaders disappear around the bend
    - baseball pitcher and catcher revising their strategy through signs after the batter anticipates every pitch
    - high-school football team defending one final attack in heavy rain, spacing and fatigue clearly staged
    - competitive swimmer alone beneath the surface before the starting signal, crowd noise reduced to vibration
    - figure skater recovering from an early mistake, choreography becoming simpler and more emotionally direct
    - cycling team rotating positions through mountain wind, strongest rider sacrificing an individual finish
    - traditional archery competitor calming their breathing while the tournament continues out of focus

  anime_mystery_scene:
    - student detectives reconstructing a locked-room event using classroom objects and conflicting witness positions
    - rural police officer comparing festival photographs and noticing the same unknown child across several decades
    - university archivist finding tomorrow's newspaper filed among century-old documents
    - passengers trapped on a stopped local train realizing each remembers a different final station
    - private investigator following a mundane accounting discrepancy into a network of neighborhood favors and secrets
    - siblings mapping sounds inside an inherited house whose rooms do not match the exterior walls
    - detective interviewing an apparently helpful witness while reflections reveal rehearsed body language
    - journalist tracing anonymous messages through discontinued vending machines across the city

  anime_horror_scene:
    - apartment resident noticing a spiral motif recurring in food, plumbing, hair and street architecture
    - school hallway extending by one door each time a student looks away, daylight remaining unnaturally constant
    - fishing village performing an ordinary morning routine while every shadow points toward the sea
    - family portrait gaining one additional relative after each household argument
    - commuter repeatedly seeing their sleeping body through the windows of trains passing in the opposite direction
    - shrine visitors hearing their own wishes answered from inside sealed offering boxes
    - medical team treating a patient whose internal anatomy changes to match each observer's expectations
    - child drawing the apartment building accurately except for a figure occupying a nonexistent upper floor

  anime_mecha_scene:
    - inexperienced pilot seeing a giant machine awaken beneath a flooded city, maintenance bridges tearing loose around it
    - repair crew working inside an open machine torso during an alarm, mechanic forced to choose what subsystem to leave broken
    - two rival pilots communicating through precise combat maneuvers while commanders misunderstand their intent
    - obsolete worker machine defending an evacuation route against modern military units, industrial tools used intelligently
    - orbital construction mecha stabilizing a damaged habitat while civilian crews evacuate through rotating corridors
    - pilot returning from battle to discover the machine preserved a recording of every previous operator
    - giant robot launching from beneath an ordinary coastal town, roads and harbor structures unfolding as practical mechanisms
    - cockpit team resolving a control conflict through trust and synchronized manual operation rather than increased power

  anime_scifi_scene:
    - android waking in a quiet care facility and recognizing every patient except the person listed as its owner
    - cybercrime investigator walking through a reconstructed memory where advertisements respond to hidden guilt
    - generation ship residents discovering their artificial sky has displayed the wrong constellation for decades
    - courier transporting an illegal personality backup through a layered city transit network
    - lunar maintenance worker receiving a live radio call from Earth delayed by far more than distance allows
    - elderly engineer showing children an abandoned orbital garden designed by a forgotten culture
    - cloned coworkers comparing tiny habits to determine which memories belong to the original
    - space-rescue crew boarding a silent vessel whose life-support system continues serving absent passengers

  anime_historical_scene:
    - wandering swordswoman facing an opponent in wind-bent grass, long preparation followed by one economical exchange
    - castle steward concealing a succession letter while rival households arrive for a formal audience
    - traveling medicine seller investigating an illness blamed on spirits but rooted in poisoned trade goods
    - village women organizing defenses while warriors are absent, farm tools and terrain shaping the plan
    - Edo-period fire brigade racing across rooftops as wind carries embers toward crowded wooden districts
    - court poet composing a politically dangerous verse during a moon-viewing ceremony
    - young craft apprentice learning a fading technique from a difficult elderly master
    - displaced family opening a small shop in a postwar neighborhood, hope and grief sharing ordinary labor

  anime_music_scene:
    - school band finding the correct tempo only after listening to the quietest member
    - punk trio performing at floor level in a tiny club while classmates discover an unexpected side of the singer
    - idol group rehearsing without costumes or audience, conflict centered on harmony, fatigue and shared responsibility
    - jazz students trading improvised phrases after the last train, empty practice room becoming an intimate stage
    - orchestra leader returning after an injury and discovering the ensemble has developed without them
    - folk musician recording regional songs before the final residents leave a mountain village
    - electronic composer sampling the mechanical rhythms of a closing factory with its workers
    - shy songwriter performing one unfinished song at a university festival as rain empties the audience area

  anime_culinary_scene:
    - young cook rebuilding a family recipe from several relatives' contradictory memories
    - rival chefs preparing the same humble ingredient, technique and hospitality distinguishing the results
    - exhausted restaurant staff serving one final table after deciding the business must close
    - traveler learning regional preservation methods during a winter stay in a remote village
    - school lunch club reducing food waste by redesigning a disliked dish with student feedback
    - pastry apprentice recovering from a collapsed showpiece through smaller precise work
    - fantasy party cooking an unfamiliar monster safely, anatomy and preparation treated with practical detail
    - widower learning to make a spouse's everyday soup for visiting grandchildren

  anime_adult_drama_scene:
    - middle-aged manager asked to dismiss a longtime colleague while their department celebrates an anniversary
    - divorced parents attending the same school event, coordinating care through restrained practical conversation
    - nurse finishing a night shift and sharing breakfast with an adult child beginning the opposite schedule
    - former activist confronting how a youthful compromise shaped the company they now lead
    - aging performer mentoring a replacement who interprets the role in a way they initially resent
    - siblings clearing their childhood apartment after a parent's death, each assigning different meaning to ordinary objects
    - municipal worker balancing evacuation policy with residents refusing to abandon a declining coastal town
    - small-business owner training an immigrant employee while both navigate assumptions and mutual dependence

  anime_childrens_scene:
    - children following a lost neighborhood cat through hidden gardens and connected rooftops before dinner
    - shy child discovering tiny household spirits repair forgotten objects at night
    - siblings building a cardboard spacecraft that transforms familiar rooms through imaginative staging
    - young forest guide helping an injured creature return to its migration group without magical combat
    - classroom caring for one seedling through a difficult season, each child contributing differently
    - child accompanying a grandparent on a slow local train journey and learning why every stop matters
    - friends staging a miniature festival for residents unable to attend the town celebration
    - curious apprentice delivering packages through a city where every district follows different visual rules

# ------------------------------------------------------------------------
# GENRE-SAFE MODULAR CHARACTERS
# Each family bundles identity, clothing, and role-defining visual details.
# ------------------------------------------------------------------------

  school_archetype:
    - diligent class representative, annotated planner, composed posture, uniform worn precisely
    - rebellious transfer student, repaired school jacket, guarded expression, scuffed indoor shoes
    - quiet literature-club member, paperback filled with notes, observant sideways gaze
    - energetic track athlete, warm-up jacket, stopwatch, hair tied away from the face
    - amateur school detective, pocket notebook, instant camera, evidence envelopes
    - anxious student-council treasurer, calculator and receipts, sleeves rolled before a late meeting
    - friendly cafeteria volunteer, apron over uniform, stacked lunch trays, practical smile
    - solitary art student, charcoal-stained fingers, portfolio case, paint on one cuff

  adult_archetype:
    - middle-aged municipal planner, weathered document case, reading glasses, tired attentive expression
    - night-shift nurse, wrinkled scrubs, practical watch, untouched canned coffee
    - neighborhood shopkeeper, apron and pencil behind one ear, keys worn smooth from use
    - investigative journalist, compact recorder, rain-dark coat, several marked notebooks
    - junior corporate manager, simple suit, employee schedules, controlled worry beneath polite posture
    - divorced parent commuting from work, grocery bag, child-made charm attached to a phone
    - veteran craft worker, scarred hands, measuring tools, indigo work jacket repaired many times
    - elderly retired teacher, walking cane, library books, former students' letters kept in a cloth folder

  action_archetype:
    - disciplined martial-arts student, plain training clothes, taped hands, balanced low stance
    - impulsive young team leader, reinforced travel jacket, first-aid pouch, chipped practice weapon
    - tactical support specialist, utility vest, route map, compact rescue tools rather than heavy weapons
    - veteran mentor, faded training uniform, old injury supported by a brace, economical posture
    - reserved rival, immaculate fitted jacket, carefully maintained equipment, unreadable expression
    - agile urban courier, helmet and protective streetwear, climbing gloves, messenger case
    - shield-bearing rescue fighter, layered impact armor, emergency markings, folding physical barrier
    - former antagonist seeking redemption, damaged insignia removed from practical combat clothing

  fantasy_archetype:
    - newly arrived otherworld traveler, ordinary modern clothes beneath a borrowed cloak, translation notebook
    - practical guild scout, weatherproof layers, trail markers, compact bow and survey tools
    - apprentice healer, linen robes, herb case, bandages and handwritten treatment manual
    - veteran caravan guard, mismatched repaired armor, spear, route tokens from distant regions
    - court mage employed as a civil servant, formal layered robes, permit seals, portable writing desk
    - monster ecologist, field clothes, specimen sketches, nonlethal traps and observation lens
    - displaced noble learning ordinary work, fine coat altered for travel, hidden signet ring
    - village shrine keeper, regional ritual clothing, weather records, bundles of protective charms

  historical_archetype:
    - wandering swordswoman, travel-stained kimono and hakama, straw hat, plain well-maintained blade
    - castle records clerk, formal period robes, document box, inkstone and coded correspondence
    - Edo fire-brigade runner, quilted coat marked with unit crest, rope and signaling clappers
    - traveling medicine seller, compartmented wooden case, ledger, practical layered clothing
    - rural midwife, winter cloak, woven supply basket, lantern protected from the wind
    - young artisan apprentice, indigo work clothes, wrapped tools, materials carried with care
    - court poet, seasonally appropriate robes, folded fan, poem slips concealed in a sleeve
    - postwar print-shop worker, rolled sleeves, ink-stained apron, salvaged type and paper bundles

  scifi_archetype:
    - orbital maintenance engineer, padded work suit, tether reel, analog diagnostic tablet
    - synthetic care worker, subtle panel seams, soft uniform, patient records held in both hands
    - cybercrime investigator, understated coat, encrypted recorder, optical overlay visible only at one eye
    - lunar courier, dust-marked pressure clothing, sealed delivery case, route patches from remote habitats
    - generation-ship agronomist, greenhouse workwear, seed archive, environmental sensor kit
    - obsolete service android, repaired casing, mismatched replacement hand, handwritten task list
    - memory technician, neutral clinic clothing, physical consent forms, isolated storage device
    - deep-space rescue specialist, compact pressure suit, cutting tools, emergency tow line

  music_archetype:
    - shy rhythm guitarist, worn instrument case, handwritten chord sheets, school cardigan
    - exacting orchestra leader, formal black attire, marked score, tuning fork and pencil
    - basement-club drummer, repaired kit hardware, hearing protection, energetic grounded posture
    - aspiring idol trainee, simple rehearsal clothes, water bottle, taped floor-position notes
    - veteran folk singer, weathered acoustic instrument, regional song archive, unshowy stage clothes
    - jazz saxophonist, practical dark suit, annotated standards book, attentive listening posture
    - electronic composer, layered everyday clothing, portable sampler, field-recording headphones
    - theater costume designer, pin-cushion wristband, fabric samples, measuring tape and production schedule

  sports_archetype:
    - volleyball setter, numbered uniform, taped fingers, eyes tracking every teammate
    - reserve baseball catcher, protective gear, pitch chart, patient analytical posture
    - distance runner balancing school and work, plain team kit, repaired shoes, transit pass
    - competitive swimmer, warm-up coat, goggles, controlled breathing before the start
    - traditional archer, formal practice clothing, glove and bow handled with deliberate care
    - injured team captain, sideline jacket, knee brace, strategy board rather than active equipment
    - novice cyclist, practical jersey, patch kit, route notes taped to the handlebar
    - veteran coach, faded club tracksuit, stopwatch, quiet expression that notices fatigue early

  supernatural_archetype:
    - shrine apprentice who hears household spirits, white-and-red work clothing, broom and offering ledger
    - reserved fox spirit living as a shop assistant, subtle ears visible in reflections, old coin purse
    - urban exorcist, ordinary office wear beneath a ritual overcoat, paper seals and chalk line
    - school ghost protecting one forgotten classroom, faded uniform, borrowed library book
    - yokai researcher, field vest, audio recorder, regional folklore maps and gift offerings
    - half-transformed guardian, human clothing strained around furred arms, protective rather than predatory stance
    - dream courier, layered night-blue robes, sealed letters addressed in sleeping handwriting
    - elderly medium, modest formal wear, family altar keys, patient expression toward an unseen visitor

  delinquent_archetype:
    - protective gang leader, modified school coat, scuffed boots, first-aid supplies hidden inside
    - motorcycle-club mechanic, work coveralls, grease-stained hands, carefully maintained helmet
    - feared student with a gentle after-school job, loosened uniform, bakery apron folded in a bag
    - former street fighter studying for entrance exams, bandaged knuckles, flash cards, library pass
    - rival-school negotiator, long coat, umbrella, written boundary agreement carried in one pocket
    - loud comic sidekick, exaggerated hairstyle, repaired bicycle, snacks shared without comment

  character_relationship:
    - protagonist and rival with mutual respect hidden beneath formal competition
    - mentor and apprentice divided over method but aligned on responsibility
    - siblings protecting one another through opposite coping strategies
    - longtime friends avoiding a conversation that could change the relationship
    - veteran and replacement learning that succession is not imitation
    - investigator and skeptical local exchanging expertise reluctantly
    - team leader and support specialist quietly reversing their expected roles
    - parent and adult child rebuilding trust through shared practical work

  team_role:
    - calm coordinator tracking the whole situation
    - impulsive initiator forcing the group to act
    - technical specialist solving material constraints
    - emotional mediator noticing unspoken conflict
    - experienced defender protecting retreat routes
    - skeptical analyst testing every assumption
    - local guide reading environment and custom
    - inexperienced newcomer asking the necessary question

  anime_creature:
    - small household spirit made from folded paper and lost buttons
    - two-tailed shrine cat carrying messages between visible and hidden communities
    - moss-covered forest guardian with deerlike anatomy and seasonal plants along its back
    - river yokai wearing found human objects as misunderstood ceremonial clothing
    - immense sky whale followed by migrating birds and weather instruments
    - practical guild slime used for cleaning, composting and carrying water
    - ancient mechanical fox with wooden outer plates and a slowly winding heart spring
    - coastal kaiju resembling layered coral, fishing nets and lighthouse beams caught across its body
    - timid dragon adapted to abandoned industrial heat rather than treasure caves
    - round child-friendly mascot creature whose expressions change through ears, tail and posture

  antagonist_archetype:
    - reformist commander using coercive methods to solve a genuine systemic danger
    - corporate executive protecting workers while concealing environmental harm
    - immortal guardian enforcing an oath whose original context has vanished
    - charismatic rival leader offering safety in exchange for obedience
    - artificial intelligence interpreting care as permanent restriction
    - monster created by accumulated abandoned objects and neglected places
    - respected mentor unable to accept that their tradition must change
    - frightened official escalating control to hide one irreversible mistake

  mecha_design:
    - industrial rescue mecha, broad lifting arms, external hydraulic lines, high-visibility panels
    - agile interceptor mecha, compact torso, folding wing surfaces, replaceable limb armor
    - obsolete worker mecha, patched paint, cargo attachments converted for emergency defense
    - orbital construction frame, multiple tool arms, tether anchors, radiation shielding
    - amphibious coastal mecha, sealed joints, ballast tanks, corrosion-streaked maintenance panels
    - ceremonial guardian machine, lacquered armor over ancient mechanical structure, repaired across generations
    - modular team-operated mecha, distinct cockpit stations, visible subsystem responsibilities
    - unmanned antagonist unit, minimal silhouette, redundant sensors, unsettlingly efficient movement

  anime_vehicle:
    - customized commuter motorcycle, hand-painted panels, repair history visible in mismatched fasteners
    - compact transforming rescue vehicle, medical storage, winch and deployable shelter
    - rural single-car train, weathered interior, driver controls and local route signs
    - orbital utility shuttle, external cargo clamps, scuffed heat shielding, analog backup instruments
    - fantasy caravan wagon adapted for rough terrain, water storage, folding workbench and sleeping space
    - historical fire-brigade cart, ladders, ropes, water tools and unit markings
    - solar racing machine, narrow aerodynamic body, repair patches from previous stages
    - small coastal research vessel, sampling crane, weather instruments and cramped crew cabin

