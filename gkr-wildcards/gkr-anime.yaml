    - cycling team rotating positions through mountain wind, strongest rider sacrificing an individual finish
    - traditional archery competitor holding a lowered bow with relaxed shoulders and one slow breath visible in cold air, blurred archers and targets continuing behind

  anime_mystery_scene:
