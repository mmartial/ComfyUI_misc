  anime_action_scene:
    - young team facing a longtime rival at a ruined tournament ground, members spaced before three escape routes with weapons and shields aimed outward
    - veteran fighter redirecting a reckless student's full-force strike with two fingers, student's weapon embedded in a split practice post, dust hanging between their contrasting stances
    - two wounded rivals lowering weapons and lifting the same collapsed beam as civilians crawl from the danger zone between them
    - courier pursued across rooftops, laundry lines and crowded balconies changing the path every few seconds
    - swordswoman defending a narrow bridge in heavy rain, low planted stance, wet stone underfoot, blade braced against three approaching attackers, no energy aura
    - exhausted hero pushing upright after a crater-forming attack, torn clothing and shaking knees, teammates reaching forward with shocked faces around the crater rim
    - coordinated team assault on a colossal creature, each role and failure visible within one clear spatial plan
    - delinquent standing between a younger student and three aggressors at a school gate, squared shoulders, open shielding arm and watching classmates forming a wide circle

  anime_romance_scene:
    - two students facing each other on opposite sides of a railway crossing, one extending a folded note while the passing train divides the frame, both faces visible through separate carriage windows
    - adult former classmates seated stiffly across a nearly empty family-restaurant booth, untouched drinks, matching old school charms beside their phones, forced smiles and eyes fixed on opposite windows
    - two coworkers missing the last train and walking home through quiet streets, conversation gradually becoming personal
    - long-distance couple sharing the same meteor shower from different cities, parallel compositions joined by matching gestures
    - four-panel sequence showing a reserved student glancing sideways, tightening a loose umbrella rib, placing the repaired umbrella beside its owner, then turning away as the owner notices it
    - widowed shopkeeper receiving a familiar seasonal order in the handwriting of a deceased spouse
    - university musicians alone in a dark rehearsal room, chairs angled toward each other, matching sheet music, one holding a final note while the other watches with lowered instrument and a small smile
    - elderly couple on a coastal station platform beside a faded photograph of their younger selves at the same bench, matching suitcase and seasonal flowers visible in both

  anime_slice_of_life_scene:
    - friends sharing convenience-store food outside a shuttered station beneath a LAST TRAIN DEPARTED display, one holding out an opened letter while the others stop eating and turn toward it
    - family preparing dinner in a cramped kitchen, several generations moving around one another through practiced routines
    - student club cleaning an abandoned room, faded team photographs, tarnished trophies and a sealed club ledger emerging from beneath dusty sheets
    - office worker carrying groceries home in summer rain, stopping to help a neighbor secure laundry in the wind
    - children exploring drainage paths after a storm, turning ordinary infrastructure into an afternoon expedition
    - rural residents reopening a shuttered local shop, sweeping dust while older customers tell conflicting stories
    - university roommates in a shared kitchen, torn chore chart taped back together, one washing the other's dishes while the other folds their laundry, cautious sidelong glances
    - train conductor walking an empty snow-covered platform before dawn, checklist and lantern in hand, gloved finger tracing numbered platform signs beside the waiting first train

  anime_comedy_scene:
    - carefully planned school announcement collapsing through a chain of mundane interruptions, ensemble reactions held in one wide frame
