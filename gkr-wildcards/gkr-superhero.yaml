# ========================================================================
# EXAMPLE SKELETON FOR tools/wildcard_generator.py
#
# Copy this file, replace the theme and namespace, then edit the GENERATOR
# comments and empty categories. The generator reads only comments beginning
# with `GENERATOR:` as instructions. Other comments are documentation.
#
# Every declared category is required in the generated wildcard. Categories
# must be empty lists. The generator may add a limited number of supporting
# categories when they are needed for coherent combinations and routes.
#
# GLOBAL RULE: Read and apply ./prompt.md (MODE: tags)
#
# GENERATOR: THEME: Original superhero worlds and decisive superhero imagery.
# GENERATOR: Cover heroic action, civilian rescue, investigation, secret bases, villains, and quiet public moments after danger.
# GENERATOR: Avoid named characters, franchises, recognizable costumes, logos, and direct imitation.
# GENERATOR: Keep powers visually understandable through anatomy, pose, material effects, damaged objects, or environmental consequences.
# ========================================================================
